message AdminReadFile {
  string daemon_id = 1;
  string project_id = 2;
  string checkout_id = 3;
  string card_id = 4;
  string path = 5;
}

message ConflictRecord { dieter.v1.PeerRecord record = 1; }

message Projects { repeated dieter.v1.Project projects = 1; }

// A machine as a new chat's destination picker names it.
message ChatDestinationMachine {
  string daemon_id = 1;
  // The client's own ID for the machine.
  string id = 2;
  string name = 3;
  bool online = 4;
  string version = 5;
}

message ChatDestinationInput {
  repeated dieter.v1.Project projects = 1;
  repeated ChatDestinationMachine machines = 2;
}

// Where a new chat can run: every attached checkout, grouped by the machine
// holding it; online machines first, then by name.
message ChatDestinationGroups {
  repeated ChatDestinationGroup groups = 1;
}

message ChatDestinationGroup {
  // The machine's client ID, else "unavailable:<daemon>" when no machine
  // reports the checkout's daemon.
  string machine_id = 1;
  string machine_name = 2;
  bool machine_online = 3;
  string machine_version = 4;
  // "Studio · Online".
  string title = 5;
  // By project name, then checkout path.
  repeated ChatDestination destinations = 6;
}

message ChatDestination {
  string project_id = 1;
  string checkout_id = 2;
  string machine_id = 3;
  // "app · Studio".
  string title = 4;
  // "Online · ~/src/app".
  string detail = 5;
  // The project's name, told apart from the machine's other checkouts of it
  // by the checkout's name or folder.
  string option_title = 6;
}

message Checkouts { repeated dieter.v1.Checkout checkouts = 1; }

// Each candidate's hostnames, for routing a captured browser page.
message HostnameSets {
  repeated HostnameSet sets = 1;
}

message HostnameSet {
  repeated string hostnames = 1;
}

// ---------------------------------------------------------------------------
// Machines: the selected machine's live telemetry (every 2 s while shown),
// and power and update operations.

// The machine telemetry surface (SLICE_TELEMETRY); there is one, whatever
// scope observes it.
message TelemetryCommand {
  oneof action {
    // Shows a machine while active; switching machines resets the operation
    // state, not what was read.
    TelemetrySelect select = 1;
    // Restarts, shuts down, or updates the selected machine; a lost reply is
    // never acted on twice. The result is the response.
    TelemetryOperation perform = 4;
  }
}

message TelemetrySelect {
  // Empty shows none.
  string daemon_id = 1;
  bool active = 2;
}

message TelemetryOperation { dieter.v1.MachineOperationAction action = 1; }

message TelemetrySlice {
  // Every machine read so far, by daemon.
  map<string, MachineReadings> machines = 2;
  bool operation_pending = 3;
  string operation_result = 4;
}

message MachineReadings {
  dieter.v1.MachineInformation information = 1;
  bool loading = 2;
  string error = 3;
  // The last CPU samples, oldest first.
  repeated double cpu_history = 4;
  // Per GPU, its last utilization samples.
  map<string, Samples> gpu_history = 5;
  // The actions menu: update, restart, and shut down, in that order, once
  // information was read. Only the daemon's operation capabilities count.
  repeated MachineOperationState operations = 6;
}

message Samples { repeated double values = 1; }

// Whether a machine offers one power or update operation.
message MachineOperationState {
  dieter.v1.MachineOperationAction action = 1;
  bool available = 2;
  // The daemon's reason when it is not available; may be empty.
  string unavailable_reason = 3;
}

// How a machine operation reads in the actions menu and its confirmation.
message MachineOperationCopy {
  // The confirmation's title, e.g. "Restart machine".
  string title = 1;
  // The confirming button, e.g. "Restart".
  string button = 2;
  // The menu item, e.g. "Restart…".
  string menu_title = 3;
  string explanation = 4;
  // Confirm with a destructive button: restart and shut down.
  bool destructive = 5;
}

// ---------------------------------------------------------------------------
// Claude Design: one machine's sign-in and whether its Claude Code turns may
// use Claude Design. Claude Code keeps every credential on that machine.

message ClaudeDesignCommand {
  oneof action {
    // Shows a machine and reads its status; switching machines cancels a
    // running sign-in. Empty shows none.
    ClaudeDesignSelect select = 1;
    Step refresh = 2;
    // Starts a sign-in on the shown machine. Its code can be submitted while
    // the machine stays shown, even after the progress stream dropped.
    Step sign_in = 3;
    Step cancel_sign_in = 4;
    // The code the manual sign-in page shows.
    ClaudeDesignCode submit_code = 5;
    ClaudeDesignAccess set_access = 6;
  }
}

message ClaudeDesignSelect { string daemon_id = 1; }
message ClaudeDesignCode { string code = 1; }
message ClaudeDesignAccess {
  bool enabled = 1;
  // With enabled false, also revoke the Claude account's agent access for
  // every Claude Code session, not only Dieter's.
  bool revoke_grant = 2;
}

message ClaudeDesignSlice {
  string daemon_id = 1;
  // Unset until read.
  dieter.v1.ClaudeDesignStatus status = 2;
  bool loading = 3;
  // Why the status could not be read or an access change failed.
  string error = 4;
  // Unset when no sign-in ran since the machine was shown.
  ClaudeDesignSignIn sign_in = 5;
  bool access_pending = 6;
  // What every client shows: e.g. "Signed in", and a sentence about it.
  string headline = 7;
  string detail = 8;
  string access_detail = 9;
  bool can_sign_in = 10;
  bool can_change_access = 11;
}

message ClaudeDesignSignIn {
  enum Phase {
    PHASE_STARTING = 0;
    // Installing the pinned Claude Code release on the machine.
    PHASE_PREPARING = 1;
    // The page is ready: open it, and paste its code when code_required.
    PHASE_WAITING = 2;
    PHASE_CHECKING_CODE = 3;
    PHASE_SUCCEEDED = 4;
    PHASE_FAILED = 5;
  }
  Phase phase = 1;
  // The page to open: the browser page that finishes by itself on the
  // machine when it is this device, else the page that shows a code.
  string open_url = 2;
  bool code_required = 3;
  string message = 4;
  bool active = 5;
}

// ---------------------------------------------------------------------------
// Provider quotas: credential-free snapshots from the gateway, watched rather
// than polled.

message QuotasCommand {
  oneof action {
    QuotasLoad load = 1;
    QuotaInclusion set_included = 2;
    // Spends one reset of an account; the result is whether it was accepted.
    QuotaAccount consume_reset = 3;
  }
}

message QuotasLoad {
  // Ask the gateway to read the providers again.
  bool refresh = 1;
}

message QuotaInclusion {
  dieter.gateway.v1.ProviderQuotaProvider provider = 1;
  string account_key = 2;
  bool included = 3;
}

message QuotaAccount { string account_key = 1; }

message QuotasSlice {
  repeated dieter.gateway.v1.ProviderQuotaGroup groups = 1;
  bool loading = 2;
  string error = 3;
  // Accounts with a change in flight.
  repeated string mutating = 4;
  // `groups` as views show them, in the same order. Wording that depends on
  // the time (resets, staleness) comes from SharedRules.
  repeated QuotaGroupRow group_rows = 6;
}

// How close an allowance is to running out: critical at 10% or less, low at
// 30% or less. A severity tint wins over a provider's brand color.
enum QuotaSeverity {
  QUOTA_SEVERITY_UNKNOWN = 0;
  QUOTA_SEVERITY_NORMAL = 1;
  QUOTA_SEVERITY_LOW = 2;
  QUOTA_SEVERITY_CRITICAL = 3;
}

// One provider's accounts, ready to show.
message QuotaGroupRow {
  dieter.gateway.v1.ProviderQuotaProvider provider = 1;
  // "OpenAI" or "Claude", for compact labels.
  string provider_name = 2;
  // "2 accounts · 1 excluded".
  string summary = 4;
  // The gateway's lowest remaining percentage over the included accounts,
  // 0-100; -1 when none reports one.
  int32 lowest_remaining = 5;
  repeated QuotaAccountRow accounts = 6;
}

// One provider account, ready to show.
message QuotaAccountRow {
  string account_key = 1;
  // A short name: the email's local part, else the plan, else "••" and the
  // key's last four characters.
  string label = 2;
  // The email, else "Plan · ••" and the key's last six characters.
  string identity = 3;
  // Under the identity: the plan when the email is shown, and whether the
  // summary excludes the account; "Account details" otherwise.
  string subtitle = 4;
  // The lowest remaining percentage of any window, 0-100; -1 when none
  // reports one.
  int32 remaining = 5;
  QuotaSeverity severity = 6;
  bool available = 7;
  // Why an unavailable account cannot be used, e.g. "Signed out"; empty
  // when available, which is never shown as a warning.
  string unavailable = 8;
  // Shown instead of windows when none report a limit, e.g. "No numeric
  // limit reported" or "rate limited".
  string status = 9;
  repeated QuotaWindowRow windows = 10;
  repeated QuotaDetail details = 11;
  // An OpenAI account with a reset credit left.
  bool can_reset = 12;
  // Counted in the provider's summary and shown in compact quota bars.
  bool included = 13;
  // The numbers are current until then; 0 when unknown, which reads as stale.
  int64 fresh_until_millis = 14;
  // For a tooltip or accessibility label, e.g.
  // "OpenAI · dev@example.com · 45% remaining" or "Claude · Pro · Signed out".
  string summary_line = 15;
  // The gateway is reading the account's numbers again.
  bool refreshing = 16;
  // The machines that reported the account, as the gateway lists them.
  repeated QuotaMachineRow machines = 17;
}

// A machine that reported a provider account.
message QuotaMachineRow {
  string daemon_id = 1;
  // The machine's name, else the start of its ID.
  string name = 2;
  bool online = 3;
  // "Online" or "Offline".
  string state = 4;
}

// Provider quota groups handed to SharedRules.quotaRows.
message QuotaGroupList {
  repeated dieter.gateway.v1.ProviderQuotaGroup groups = 1;
}

// SharedRules.quotaRows: the groups as `QuotasSlice.group_rows` shows them.
message QuotaGroupRows {
  repeated QuotaGroupRow rows = 1;
}

// One quota window of an account.
message QuotaWindowRow {
  string id = 1;
  // The provider's label, else "5 hour", "Weekly", "Monthly", "Model", or "Quota".
  string name = 2;
  // 0-100; -1 when not reported ("Not reported").
  int32 remaining = 3;
  QuotaSeverity severity = 4;
  // RFC 3339, or empty; SharedRules.quotaResetText words it.
  string resets_at = 5;
}

// One label and text row of an account's details.
message QuotaDetail {
  string label = 1;
  string text = 2;
  // A balance or spend, which views that keep money off screen leave out.
  bool monetary = 3;
}

// ---------------------------------------------------------------------------
// Labels: the palette every client offers when it creates or edits a label.
// Any six-digit hex color is valid; the palette only suggests.

// The choices project and board forms offer, and what a new project or
// board starts with, as every client words them.
message AdminOptions {
  repeated AdminChoice workflows = 1;
  repeated AdminChoice publish_modes = 2;
  repeated AdminChoice archive_policies = 3;
  string default_board_name = 4;
  string default_workflow = 5;
  string default_base_remote = 6;
  string default_base_branch = 7;
  string default_publish_mode = 8;
  string default_archive_policy = 9;
  // What a new validation command's form starts with.
  ValidationDraft new_validation = 10;
}

message AdminChoice {
  // The value a request carries, e.g. "review" or "after_7_days".
  string id = 1;
  // "With review", "After 7 days".
  string title = 2;
  // What the choice does, when the form explains it.
  string detail = 3;
  // A workflow's lanes: "Todo → Running → Review → Done".
  string lanes = 4;
}

// A validation command as its form edits it: arguments and environment one
// per line, the timeout as typed.
message ValidationDraft {
  string name = 1;
  string executable = 2;
  string arguments = 3;
  string working_directory = 4;
  string environment = 5;
  string timeout_seconds = 6;
}

message ValidationDrafts {
  repeated ValidationDraft drafts = 1;
}

message LabelPalette {
  repeated LabelSwatch swatches = 1;
}

// One palette color, e.g. "Teal" and "#379799".
message LabelSwatch {
  string name = 1;
  string hex = 2;
}

// ---------------------------------------------------------------------------
// Processes: the background processes an agent started for one conversation,
// one surface per view (SLICE_PROCESSES). While active, the list refreshes
// every 2 s and the selected process streams its output. Hiding the view never
// stops a process; only an explicit stop does.

message ProcessesCommand {
  string scope = 1;
  oneof action {
    ProcessesTarget bind = 2;
    ProcessId select = 3;
    Step stop = 4;
  }
}

message ProcessesTarget {
  string daemon_id = 1;
  string project_id = 2;
  string card_id = 3;
  // Shown now: refresh and stream.
  bool active = 4;
}

message ProcessId { string execution_id = 1; }

message ProcessesSlice {
  string daemon_id = 1;
  string project_id = 2;
  string card_id = 3;
  repeated dieter.v1.Execution processes = 4;
  string selected_id = 5;
  // The selected process's newest output, bounded.
  bytes stdout = 6;
  bytes stderr = 7;
  // Older output was dropped.
  bool output_truncated = 8;
  bool loading = 9;
  bool stopping = 10;
  string error = 11;
  int32 running = 12;
  bool can_stop = 13;
}

// ---------------------------------------------------------------------------
// Search: tasks and chats by title, task text, and location; every term must
// prefix a word. Transcripts are never searched.

message SearchCommand {
  string query = 1;
}

message SearchResults { repeated SearchHit hits = 1; }

message SearchHit {
  string card_id = 1;
  string title = 2;
  // "Project · Board"; empty for an unfiled chat.
  string location = 3;
  bool chat = 4;
}

// ---------------------------------------------------------------------------
// Screens: sharing a machine's screen, one surface per view (SLICE_SCREEN).
// The native media engine only moves pixels and packets; the core owns
// signaling, trust, the lease, recovery, configuration, input, clipboard
// sync, and resolution matching.

message ScreenCommand {
  string scope = 1;
  oneof action {
    // Starts a session with a machine; an earlier one is closed first.
    ScreenConnect connect = 2;
    Step disconnect = 3;
    // The view's size; the requested stream size follows, debounced.
    ScreenViewport viewport = 4;
    ScreenPreferences preferences = 5;
    // Takes or hands back control, once at a time.
    Toggle control = 6;
    // Moves the remote pointer; quick moves coalesce.
    ScreenPointer pointer = 7;
    ScreenButton button = 8;
    ScreenScroll scroll = 9;
    // A physical key by USB HID usage.
    ScreenKey key = 10;
    // Committed text.
    ScreenText text = 11;
    // Releases every held key and button on the host.
    Step release_input = 12;
    // "copy", "cut", or "paste" on the host.
    ScreenClipboardOperation clipboard = 13;
    Toggle clipboard_enabled = 14;
    // The device woke or the app returned: start over at once.
    Step resume = 15;
    // The device is going to sleep: release held input.
    Step sleep = 16;
    Toggle focused = 17;
    // Matches the host display to this screen while holding control; an
    // empty target stops matching and restores a temporary mode.
    ScreenDisplayTarget match_display = 18;
    // Asks the host for a fresh frame.
    Step refresh = 19;
  }
}

message ScreenConnect { string daemon_id = 1; }

message ScreenViewport {
  double width_points = 1;
  double height_points = 2;
  double scale = 3;
}

message ScreenPreferences {
  dieter.v1.RemoteDesktopCodecPreference codec = 1;
  int32 max_fps = 2;
  dieter.v1.RemoteDesktopQuality quality = 3;
  string display_id = 4;
  bool clipboard = 5;
  bool virtual_display = 6;
  bool disable_physical = 7;
  int32 virtual_scale = 8; // 1 or 2, defaults to 2.

}

message ScreenPointer {
  // Normalized to the shared display, 0 to 1.
  double x = 1;
  double y = 2;
}

message ScreenButton {
  dieter.v1.RemoteDesktopPointerButton.Button button = 1;
  bool down = 2;
  int32 clicks = 3;
  double x = 4;
  double y = 5;
  // Shift 1, Control 2, Option 4, Command 8, Caps Lock 16, Function 32.
  int32 modifiers = 6;
}

message ScreenScroll {
  double dx = 1;
  double dy = 2;
  int32 phase = 3;
  int32 momentum = 4;
  int32 modifiers = 5;
  bool precise = 6;
}

message ScreenKey {
  int32 hid = 1;
  bool down = 2;
  bool repeat = 3;
  int32 modifiers = 4;
}

message ScreenText {
  string text = 1;
  int32 modifiers = 2;
}

message ScreenClipboardOperation { string operation = 1; }

message ScreenDisplayTarget {
  // Points; zero stops matching.
  double width = 1;
  double height = 2;
  double scale = 3;
  double refresh = 4;
}

message ScreenSlice {
  // "idle", "loading", "permission_required", "unsupported", "connecting",
  // "waiting_for_host_approval", "streaming", "reconnecting", or "failed".
  string phase = 1;
  // The phase as status lines show it: "Not connected", "Checking machine…",
  // "Live", "Connection failed", …; phases in progress end with "…".
  string phase_label = 2;
  // Why no session can run, or why it is reconnecting.
  string problem = 3;
  // Holding or establishing a session.
  bool active = 4;
  dieter.v1.RemoteDesktopCapabilities capabilities = 5;
  dieter.v1.RemoteDesktopSessionState state = 6;
  bool control_active = 9;
  bool can_transfer_control = 10;
  bool control_transferring = 11;
  string control_error = 12;
  string codec_fallback_reason = 13;
  bool clipboard_enabled = 14;
  string clipboard_error = 15;
  bool clipboard_busy = 16;
  int32 clipboard_operations = 17;
  // The host cursor image (PNG); left out when unchanged since the
  // previous update.
  bytes cursor_image = 18;
  bool cursor_image_unchanged = 19;
  double cursor_x = 20;
  double cursor_y = 21;
  bool cursor_visible = 22;
  double cursor_width = 23;
  double cursor_height = 24;
  double cursor_hotspot_x = 25;
  double cursor_hotspot_y = 26;
  string route_label = 27;
  ScreenPreferences preferences = 28;
  // Resolution matching while holding control.
  string display_status = 29;
  // The frame-rate choices the host allows, e.g. 30, 60, 90, 120.
  repeated int32 frame_rates = 31;
  // Why this client cannot take control of the live session; empty while it
  // can or is not streaming.
  string control_unavailable_reason = 32;
  // Copy and paste can run: controlling, sharing the clipboard, and no
  // clipboard operation in flight.
  bool clipboard_actions_enabled = 33;
  // The network round trip: "12 ms RTT", "<1 ms RTT", or "— ms RTT" without
  // a measurement or outside streaming.
  string latency_label = 34;
  // "Connected · Control" or "Connected · View only" while streaming, else
  // the phase label.
  string status_line = 35;
  // The line above the canvas: "1920 × 1080 · H264 · 60 fps · Direct media"
  // while streaming, leaving out what is unknown.
  string metadata = 36;
  // "Direct media", "Relayed media", or empty until the media path is known.
  string media_route = 37;
  // The connection details, one "Name · value" line each.
  repeated string details = 38;
  bool streaming = 39;
  // The machine cannot share its screen: permission or support is missing.
  bool blocked = 40;
  bool failed = 41;
  // How the phase reads: streaming succeeds, a session on its way is a
  // warning, a failure is danger.
  Tone tone = 42;
  // "Control" or "View only".
  string control_label = 43;
  // "2 viewers · Pixel controls" while others watch too; empty otherwise.
  string viewers_label = 44;
}

// The native media engine across the Apple bridge, encoded.

message ScreenMediaCapabilities {
  repeated RtpCodec receive_codecs = 1;
  bool hevc_decoder = 2;
  bool reference_dependencies = 3;
  bool millisecond_timestamps = 4;
  // A decoder or renderer that cannot start; the session fails before offering.
  string initialization_failure = 5;
}

message RtpCodec {
  string name = 1;
  string profile = 2;
}

message ScreenMediaConfig {
  dieter.gateway.v1.RTCConfiguration rtc = 1;
  repeated RtpCodec codecs = 2;
  bool enable_reference_dependencies = 3;
  repeated ScreenChannel channels = 4;
  bool relay_only = 5;
}

message ScreenChannel {
  string label = 1;
  bool ordered = 2;
  // Unset retransmits until delivered.
  optional int32 max_retransmits = 3;
}

message ClipboardContent {
  string text = 1;
  repeated dieter.v1.RemoteDesktopClipboardItem items = 2;
}

// The stream choices a screen's options offer, in menu order
// (SharedRules.screenStreamOptions).
message ScreenStreamOptions {
  // "Automatic quality", "Sharp text", "Responsive motion".
  repeated ScreenQualityOption qualities = 1;
  // "Automatic codec", "H.264 compatibility", "HEVC · up to 1080p60".
  repeated ScreenCodecOption codecs = 2;
}

message ScreenQualityOption {
  string label = 1;
  dieter.v1.RemoteDesktopQuality quality = 2;
}

message ScreenCodecOption {
  string label = 1;
  dieter.v1.RemoteDesktopCodecPreference codec = 2;
}

// The keys a touch screen's toolbar offers (SharedRules.screenToolbarKeys).
message ScreenToolbarKeys {
  // Control, Option, Shift, and Command, which arm a modifier.
  repeated ScreenToolbarKey modifiers = 1;
  // Escape, Tab, the arrows, Enter, Backspace, Delete, Home, End, Page Up,
  // Page Down, and F1 to F12, in toolbar order.
  repeated ScreenToolbarKey special = 2;
}

// One toolbar key: its label, e.g. "Esc", and USB HID usage.
message ScreenToolbarKey {
  string label = 1;
  int32 hid = 2;
  // The modifier bit a modifier key arms (Shift 1, Control 2, Option 4,
  // Command 8); 0 for other keys.
  int32 modifier = 3;
}
