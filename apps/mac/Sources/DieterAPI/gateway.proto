syntax = "proto3";

package dieter.gateway.v1;

option go_package = "github.com/dbpprt/dieter/internal/gen/dieter/gateway/v1;gatewayv1";
option java_multiple_files = true;
option java_outer_classname = "DieterGatewayProto";
option java_package = "com.dbpprt.dieter.gateway.v1";

import "google/protobuf/empty.proto";

// GatewayService is Dieter's account and machine directory. Project,
// conversation, schedule, file, and provider credential data never enters this
// service. The gateway may cache normalized, credential-free provider quota
// snapshots for the authenticated account.
service GatewayService {
  // GetCompatibility is the stable, unauthenticated bootstrap used before
  // sign-in. It contains no account or machine data.
  rpc GetCompatibility(CompatibilityRequest) returns (CompatibilityResponse);
  rpc GetAccount(google.protobuf.Empty) returns (Account);
  rpc ListDaemons(google.protobuf.Empty) returns (ListDaemonsResponse);
  rpc WatchDaemons(WatchDaemonsRequest) returns (stream DaemonPresenceUpdate);
  rpc BeginDaemonEnrollment(BeginDaemonEnrollmentRequest) returns (DaemonEnrollment);
  rpc CompleteDaemonEnrollment(CompleteDaemonEnrollmentRequest) returns (DaemonCredential);
  rpc UnenrollDaemon(UnenrollDaemonRequest) returns (google.protobuf.Empty);
  rpc RenameDaemon(RenameDaemonRequest) returns (Daemon);
  rpc RevokeDaemon(DaemonRef) returns (google.protobuf.Empty);
  // Restore a revoked machine using its still-active replacement's identical
  // private key. The replacement remains enrolled until the owner verifies the
  // restored machine and explicitly revokes it.
  // Read the current revocation generation before signing a one-event proof.
  rpc InspectDaemonRecovery(DaemonRecoveryRef) returns (DaemonRecoveryState);
  rpc RecoverDaemon(RecoverDaemonRequest) returns (DaemonCredential);
  rpc ExchangeDaemonToken(ExchangeDaemonTokenRequest) returns (DaemonAccessToken);
  rpc ResolveDaemonRoute(DaemonRef) returns (DaemonRoute);
  // GetRTCConfiguration returns daemon-bound, short-lived ICE configuration.
  // The signed envelope is verified by the daemon before a desktop session is
  // admitted; the gateway never participates in the WebRTC media path.
  rpc GetRTCConfiguration(DaemonRef) returns (RTCConfiguration);
  rpc ListProviderQuotas(ListProviderQuotasRequest) returns (ListProviderQuotasResponse);
  rpc WatchProviderQuotas(WatchProviderQuotasRequest) returns (stream ProviderQuotaUpdate);
  rpc RefreshProviderQuotas(RefreshProviderQuotasRequest) returns (RefreshProviderQuotasResponse);
  rpc SetProviderQuotaSummaryInclusion(SetProviderQuotaSummaryInclusionRequest) returns (SetProviderQuotaSummaryInclusionResponse);
  rpc ConsumeProviderQuotaReset(ConsumeProviderQuotaResetRequest) returns (ConsumeProviderQuotaResetResponse);
}

// DaemonLinkService is a persistent daemon-initiated reverse tunnel. Every
// logical Dieter RPC is framed independently so one slow conversation stream
// cannot block unrelated calls on the same machine.
service DaemonLinkService {
  rpc Connect(stream DaemonLinkFrame) returns (stream DaemonLinkFrame);
}

message Account {
  int64 github_id = 1;
  string login = 2;
  // Signed, account-bound current endpoint. Identity survives a DNS move.
  string signed_gateway_endpoint = 3;
}

message DaemonRef {
  string daemon_id = 1;
}

message Daemon {
  string id = 1;
  string name = 2;
  bool online = 3;
  string last_seen_at = 4;
  // Canonical Dieter release version. The field number is retained from the
  // former generic version field for wire continuity.
  string release_version = 5;
  uint64 generation = 6;
  repeated DirectCandidate direct_candidates = 7;
  RemoteDesktopPresence remote_desktop = 8;
  reserved 9;
  reserved "api_version";
  CompatibilityStatus compatibility = 10;
  string minimum_release_version = 11;
}

// RemoteDesktopPresence is intentionally coarse gateway metadata. Display
// names, geometry, and OS permission details remain daemon-owned data.
message RemoteDesktopPresence {
  string platform = 1;
  string helper_version = 2;
  bool ready = 3;
  string reason = 4;
  bool active_session = 5;
}

message ListDaemonsResponse {
  repeated Daemon daemons = 1;
  GatewayInformation gateway_information = 2;
}

message GatewayInformation {
  string release_version = 1;
  reserved 2;
  reserved "api_version";
  string source_revision = 3;
  string built_at = 4;
  CompatibilityPolicy compatibility_policy = 5;
}

enum CompatibilityComponent {
  COMPATIBILITY_COMPONENT_UNSPECIFIED = 0;
  COMPATIBILITY_COMPONENT_CLIENT = 1;
  COMPATIBILITY_COMPONENT_DAEMON = 2;
}

enum CompatibilityStatus {
  COMPATIBILITY_STATUS_UNSPECIFIED = 0;
  COMPATIBILITY_STATUS_COMPATIBLE = 1;
  COMPATIBILITY_STATUS_UPDATE_REQUIRED = 2;
  COMPATIBILITY_STATUS_INVALID_VERSION = 3;
}

message CompatibilityPolicy {
  string gateway_release_version = 1;
  string minimum_client_version = 2;
  string minimum_daemon_version = 3;
  string revision = 4;
}

message CompatibilityRequest {
  string release_version = 1;
  CompatibilityComponent component = 2;
}

message CompatibilityResponse {
  CompatibilityPolicy policy = 1;
  CompatibilityStatus status = 2;
  string current_release_version = 3;
  string minimum_release_version = 4;
}

message WatchDaemonsRequest {
  uint32 heartbeat_seconds = 1;
}

message DaemonPresenceUpdate {
  repeated Daemon daemons = 1;
  uint64 revision = 2;
  GatewayInformation gateway_information = 3;
}

message BeginDaemonEnrollmentRequest {
  string name = 1;
  bytes public_key = 2;
}

message DaemonEnrollment {
  string enrollment_id = 1;
  string enrollment_secret = 2;
  string verification_url = 3;
  string user_code = 4;
  string expires_at = 5;
}

message CompleteDaemonEnrollmentRequest {
  string enrollment_id = 1;
  string enrollment_secret = 2;
}

message UnenrollDaemonRequest {
  string daemon_id = 1;
  bytes nonce = 2;
  bytes signature = 3;
}

message DaemonRecoveryRef {
  string revoked_daemon_id = 1;
  string replacement_daemon_id = 2;
}

message DaemonRecoveryState {
  uint64 revoked_generation = 1;
  uint64 replacement_generation = 2;
}

message RecoverDaemonRequest {
  string revoked_daemon_id = 1;
  string replacement_daemon_id = 2;
  bytes nonce = 3;
  bytes signature = 4;
  uint64 revoked_generation = 5;
  uint64 replacement_generation = 6;
}

message DaemonCredential {
  string daemon_id = 1;
  string daemon_name = 2;
  bytes certificate_pem = 3;
  bytes daemon_ca_pem = 4;
  bytes gateway_signing_public_key = 5;
  string expires_at = 6;
  uint64 generation = 7;
  // Durable issuer/account namespace; independent of the public network URL.
  string gateway_issuer = 8;
}

message RenameDaemonRequest {
  string daemon_id = 1;
  string name = 2;
}

message ExchangeDaemonTokenRequest {
  string daemon_id = 1;
  // Reserved for a future proof-of-possession token profile. Empty for the
  // current short-lived bearer profile.
  string client_key_thumbprint = 2;
}

message DaemonAccessToken {
  string access_token = 1;
  string token_type = 2;
  string expires_at = 3;
  uint64 daemon_generation = 4;
}

message DirectCandidate {
  string id = 1;
  string host = 2;
  uint32 port = 3;
  string network = 4;
  int32 priority = 5;
  string certificate_identity = 6;
}

message DaemonRoute {
  string daemon_id = 1;
  bool relay_available = 2;
  repeated DirectCandidate direct_candidates = 3;
  uint64 generation = 4;
  // Trust anchor for direct daemon TLS. It is returned only to the owning
  // authenticated account and is never needed for the gateway relay path.
  bytes daemon_ca_pem = 5;
  // The authenticated owner uses the enrolled leaf certificate to verify
  // daemon-signed remote-desktop session bindings on both relay and direct
  // signaling routes.
  bytes daemon_certificate_pem = 6;
  bool control_webrtc = 7;
}

message RTCIceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message RTCConfiguration {
  repeated RTCIceServer ice_servers = 1;
  string expires_at = 2;
  string daemon_id = 3;
  bytes signed_envelope = 4;
  string operator_subject = 5;
  string configuration_id = 6;
  uint64 daemon_generation = 7;
  string issued_at = 8;
}

enum ProviderQuotaProvider {
  PROVIDER_QUOTA_PROVIDER_UNSPECIFIED = 0;
  PROVIDER_QUOTA_PROVIDER_OPENAI_CODEX = 1;
  PROVIDER_QUOTA_PROVIDER_ANTHROPIC_CLAUDE = 2;
}

enum ProviderAccountKind {
  PROVIDER_ACCOUNT_KIND_UNSPECIFIED = 0;
  PROVIDER_ACCOUNT_KIND_SUBSCRIPTION = 1;
  PROVIDER_ACCOUNT_KIND_API = 2;
}

enum ProviderQuotaAvailability {
  PROVIDER_QUOTA_AVAILABILITY_UNSPECIFIED = 0;
  PROVIDER_QUOTA_AVAILABILITY_AVAILABLE = 1;
  PROVIDER_QUOTA_AVAILABILITY_SIGNED_OUT = 2;
  PROVIDER_QUOTA_AVAILABILITY_UNSUPPORTED = 3;
  PROVIDER_QUOTA_AVAILABILITY_TEMPORARILY_UNAVAILABLE = 4;
  PROVIDER_QUOTA_AVAILABILITY_PERMISSION_DENIED = 5;
}

enum ProviderQuotaWindowKind {
  PROVIDER_QUOTA_WINDOW_KIND_UNSPECIFIED = 0;
  PROVIDER_QUOTA_WINDOW_KIND_FIVE_HOUR = 1;
  PROVIDER_QUOTA_WINDOW_KIND_WEEKLY = 2;
  PROVIDER_QUOTA_WINDOW_KIND_MONTHLY = 3;
  PROVIDER_QUOTA_WINDOW_KIND_MODEL = 4;
  PROVIDER_QUOTA_WINDOW_KIND_OTHER = 5;
}

enum ProviderQuotaRefreshState {
  PROVIDER_QUOTA_REFRESH_STATE_UNSPECIFIED = 0;
  PROVIDER_QUOTA_REFRESH_STATE_IDLE = 1;
  PROVIDER_QUOTA_REFRESH_STATE_REFRESHING = 2;
  PROVIDER_QUOTA_REFRESH_STATE_THROTTLED = 3;
  PROVIDER_QUOTA_REFRESH_STATE_FAILED = 4;
}

enum ProviderQuotaFreshness {
  PROVIDER_QUOTA_FRESHNESS_UNSPECIFIED = 0;
  PROVIDER_QUOTA_FRESHNESS_FRESH = 1;
  PROVIDER_QUOTA_FRESHNESS_STALE = 2;
}

message ProviderQuotaWindow {
  string id = 1;
  string label = 2;
  ProviderQuotaWindowKind kind = 3;
  optional uint32 used_percent = 4;
  optional uint32 remaining_percent = 5;
  optional uint32 duration_minutes = 6;
  string resets_at = 7;
}

message ProviderCreditBalance {
  string balance = 1;
  optional bool has_credits = 2;
  bool unlimited = 3;
}

message ProviderSpendAllowance {
  string used = 1;
  string limit = 2;
  string currency = 3;
  optional uint32 remaining_percent = 4;
  string resets_at = 5;
}

message ProviderResetCredit {
  string title = 1;
  string kind = 2;
  string status = 3;
  string granted_at = 4;
  string expires_at = 5;
}

message ProviderResetCredits {
  uint32 available_count = 1;
  repeated ProviderResetCredit details = 2;
}

// ProviderQuotaMachine is gateway-owned presence metadata for an enrolled
// machine that advertised this exact provider account. Daemons never populate
// this field in quota results.
message ProviderQuotaMachine {
  string daemon_id = 1;
  string name = 2;
  bool online = 3;
  ProviderQuotaAvailability availability = 4;
  string last_seen_at = 5;
}

// ProviderQuotaSnapshot is normalized provider data for exactly one account.
// account_key is an opaque, gateway-account-scoped HMAC and is not a provider
// account identifier or credential. display_email is optional display-only
// metadata from the provider's structured account API.
message ProviderQuotaSnapshot {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
  ProviderAccountKind account_kind = 3;
  string plan = 4;
  ProviderQuotaAvailability availability = 5;
  repeated ProviderQuotaWindow windows = 6;
  string next_reset_at = 7;
  string next_reset_window_id = 8;
  ProviderCreditBalance credits = 9;
  ProviderSpendAllowance spend_allowance = 10;
  ProviderResetCredits reset_credits = 11;
  optional bool ordinary_usage_allowed = 12;
  string refreshed_at = 13;
  string next_refresh_at = 14;
  string fresh_until = 15;
  string last_success_at = 16;
  ProviderQuotaRefreshState refresh_state = 17;
  uint32 online_source_count = 18;
  string status_code = 19;
  string display_email = 20;
  optional bool included_in_summary = 21;
  repeated ProviderQuotaMachine machines = 22;
}

// ProviderQuotaSummary is the deterministic provider-level API/CLI summary.
// Native clients may instead render each account independently. The selected
// percentage is the lowest remaining value across distinct accounts and
// windows; separate account quotas are never summed or averaged.
message ProviderQuotaSummary {
  uint32 total_account_count = 1;
  uint32 numeric_account_count = 2;
  uint32 unavailable_account_count = 3;
  optional uint32 remaining_percent = 4;
  string summary_account_key = 5;
  string summary_window_id = 6;
  ProviderQuotaWindowKind summary_window_kind = 7;
  string summary_window_label = 8;
  string resets_at = 9;
  ProviderQuotaFreshness freshness = 10;
  uint32 included_account_count = 11;
  uint32 excluded_account_count = 12;
}

message ProviderQuotaGroup {
  ProviderQuotaProvider provider = 1;
  repeated ProviderQuotaSnapshot accounts = 2;
  ProviderQuotaSummary summary = 3;
}

message ListProviderQuotasRequest {
  ProviderQuotaProvider provider = 1;
}

message ListProviderQuotasResponse {
  repeated ProviderQuotaGroup groups = 1;
  uint64 revision = 2;
  GatewayInformation gateway_information = 3;
}

message WatchProviderQuotasRequest {
  uint32 heartbeat_seconds = 1;
  ProviderQuotaProvider provider = 2;
}

message ProviderQuotaUpdate {
  repeated ProviderQuotaGroup groups = 1;
  uint64 revision = 2;
  bool heartbeat = 3;
}

message RefreshProviderQuotasRequest {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
}

message RefreshProviderQuotasResponse {
  repeated ProviderQuotaGroup groups = 1;
  uint64 revision = 2;
  bool accepted = 3;
}

message SetProviderQuotaSummaryInclusionRequest {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
  bool included = 3;
}

message SetProviderQuotaSummaryInclusionResponse {
  repeated ProviderQuotaGroup groups = 1;
  uint64 revision = 2;
}

message ConsumeProviderQuotaResetRequest {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
  // Reuse the same UUID when retrying an uncertain request.
  string idempotency_key = 3;
}

message ConsumeProviderQuotaResetResponse {
  repeated ProviderQuotaGroup groups = 1;
  uint64 revision = 2;
  bool accepted = 3;
}

message ProviderAccountPresence {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
  ProviderAccountKind account_kind = 3;
  string plan = 4;
  ProviderQuotaAvailability availability = 5;
  bool refresh_supported = 6;
}

message ProviderAccountsPresence {
  repeated ProviderAccountPresence accounts = 1;
}

message ProviderQuotaRefreshRequest {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
}

message ProviderQuotaRefreshResult {
  ProviderQuotaSnapshot snapshot = 1;
  string error_code = 2;
  uint32 retry_after_seconds = 3;
}

message ProviderQuotaResetRequest {
  ProviderQuotaProvider provider = 1;
  string account_key = 2;
  string idempotency_key = 3;
}

message ProviderQuotaResetResult {
  ProviderQuotaSnapshot snapshot = 1;
  string outcome = 2;
  string error_code = 3;
  uint32 retry_after_seconds = 4;
}

enum DaemonLinkFrameKind {
  DAEMON_LINK_FRAME_KIND_UNSPECIFIED = 0;
  DAEMON_LINK_FRAME_KIND_HELLO = 1;
  DAEMON_LINK_FRAME_KIND_HELLO_ACK = 2;
  DAEMON_LINK_FRAME_KIND_HEARTBEAT = 3;
  DAEMON_LINK_FRAME_KIND_ROUTES = 4;
  DAEMON_LINK_FRAME_KIND_OPEN_RPC = 5;
  DAEMON_LINK_FRAME_KIND_REQUEST_MESSAGE = 6;
  DAEMON_LINK_FRAME_KIND_REQUEST_END = 7;
  DAEMON_LINK_FRAME_KIND_CANCEL_RPC = 8;
  DAEMON_LINK_FRAME_KIND_RESPONSE_HEADER = 9;
  DAEMON_LINK_FRAME_KIND_RESPONSE_MESSAGE = 10;
  DAEMON_LINK_FRAME_KIND_RESPONSE_END = 11;
  DAEMON_LINK_FRAME_KIND_RPC_ERROR = 12;
  DAEMON_LINK_FRAME_KIND_WINDOW_UPDATE = 13;
  DAEMON_LINK_FRAME_KIND_PING = 14;
  DAEMON_LINK_FRAME_KIND_PONG = 15;
  DAEMON_LINK_FRAME_KIND_PROVIDER_ACCOUNTS = 16;
  DAEMON_LINK_FRAME_KIND_PROVIDER_QUOTA_REFRESH_REQUEST = 17;
  DAEMON_LINK_FRAME_KIND_PROVIDER_QUOTA_REFRESH_RESULT = 18;
  DAEMON_LINK_FRAME_KIND_PROVIDER_QUOTA_RESET_REQUEST = 19;
  DAEMON_LINK_FRAME_KIND_PROVIDER_QUOTA_RESET_RESULT = 20;
}

message DaemonLinkFrame {
  DaemonLinkFrameKind kind = 1;
  uint64 stream_id = 2;
  string daemon_id = 3;
  string request_id = 4;
  string method = 5;
  bytes payload = 6;
  bytes payload_sha256 = 7;
  string delegation_assertion = 8;
  int64 deadline_unix_millis = 9;
  int32 status_code = 10;
  string status_message = 11;
  map<string, string> metadata = 12;
  uint32 window_bytes = 13;
  string release_version = 14;
  uint64 generation = 15;
  repeated DirectCandidate direct_candidates = 16;
  RemoteDesktopPresence remote_desktop = 17;
  reserved 18;
  reserved "api_version";
  repeated string capabilities = 19;
  bytes provider_account_correlation_key = 20;
  ProviderAccountsPresence provider_accounts = 21;
  ProviderQuotaRefreshRequest provider_quota_refresh_request = 22;
  ProviderQuotaRefreshResult provider_quota_refresh_result = 23;
  ProviderQuotaResetRequest provider_quota_reset_request = 24;
  ProviderQuotaResetResult provider_quota_reset_result = 25;
  CompatibilityPolicy compatibility_policy = 26;
  CompatibilityStatus compatibility = 27;
}
