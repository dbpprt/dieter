# Kotlin, AGP, coroutines, and OkHttp come from the shared core's catalog
# (`coreLibs`, apps/core/gradle/libs.versions.toml), which this build includes.
[versions]
activity = "1.13.0"
compose = "1.12.1"
core = "1.19.0"
androidxJunit = "1.3.0"
testRunner = "1.7.0"

[libraries]
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.83" }
bouncycastle-tls = { module = "org.bouncycastle:bctls-jdk18on", version = "1.83" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }

androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
