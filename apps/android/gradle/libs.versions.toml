# Kotlin, AGP, coroutines, and OkHttp come from the shared core's catalog
# (`coreLibs`, apps/core/gradle/libs.versions.toml), which this build includes.
[versions]
composeBom = "2026.08.00"
activity = "1.13.0"
lifecycle = "2.11.0"
core = "1.19.0"
graphicsPath = "1.1.0"
termuxTerminal = "v0.118.3"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
testRules = "1.7.0"

[libraries]
webrtc = { module = "io.github.webrtc-sdk:android", version = "150.7871.01" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.83" }
bouncycastle-tls = { module = "org.bouncycastle:bctls-jdk18on", version = "1.83" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
termux-terminal-emulator = { module = "com.github.termux.termux-app:terminal-emulator", version.ref = "termuxTerminal" }
termux-terminal-view = { module = "com.github.termux.termux-app:terminal-view", version.ref = "termuxTerminal" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "testRules" }
