# The single source of tool versions for local work and CI (jdx/mise-action).
# `mise install --locked` installs exactly the versions recorded in mise.lock;
# update with `mise lock` after editing a pin. Xcode, Android SDKs, simulator
# runtimes, emulators and Docker are installed separately (fastlane/README.md).
min_version = "2026.10.2"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "linux-arm64"]

[tools]
# Languages. Ruby reads .ruby-version and Go reads go.mod.
ruby = "{{ read_file(path='.ruby-version') | trim }}"
go = "{{ read_file(path='go.mod') | regex_replace(pattern='(?sm)^.*?^go ([0-9.]+)$.*', rep='$1') | trim }}"
node = "22"
python = "3.13"
java = "temurin-21"
"gem:bundler" = "2.6.9"

# Build, schema and site tools.
just = "1.58.0"
protoc = "36.1"
buf = "1.73.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
protoc-gen-connect-go = "1.20.0"
"hugo-extended" = "0.164.0"
ripgrep = "15.1.0"

# Go checks.
golangci-lint = "2.14.0"
gotestsum = "1.13.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# Formatters and repository checks (`just fmt`, `just lint`).
shfmt = "3.14.1"
ruff = "0.16.10"
prettier = "3.9.9"
"gem:syntax_tree" = "6.3.0"
"http:ktfmt" = { version = "0.64", url = "https://github.com/Kotlin/ktfmt/releases/download/v{{ version }}/ktfmt-{{ version }}-with-dependencies.jar", checksum = "sha256:b8fbb814808d8da33f74a7bbacb6d1748cef81c0202a7f829b87139520b51273" }
actionlint = "1.7.12"
gitleaks = "8.30.1"

# Apple build output and native device tests.
xcbeautify = { version = "3.2.1", os = ["macos"] }
maestro = "cli-2.11.0"

# Release signing and OCI publication (CI installs them only in release jobs).
cosign = "3.1.3"
oras = "1.3.4"

[tasks.setup]
description = "Install locked gems and the harness runtime dependencies; no app builds or device setup"
dir = "{{ config_root }}"
run = ["bundle install", "npm --prefix internal/harness/runtime ci"]
