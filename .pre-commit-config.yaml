minimum_pre_commit_version: "4.6.2"
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: staged-source
        name: Check staged formatting and file integrity
        entry: python3 fastlane/lib/dieter/precommit.py check
        language: unsupported
        always_run: true
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        always_run: true
