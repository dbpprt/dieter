<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nauclio mark</title>
  <desc id="desc">Three terminal sessions docked inside a three-spoke command wheel.</desc>
  <defs>
    <linearGradient id="ring" x1="170" y1="145" x2="854" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1546C8"/>
    </linearGradient>
    <linearGradient id="head" x1="402" y1="190" x2="624" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2588F5"/>
    </linearGradient>
    <g id="session">
      <rect x="402" y="190" width="220" height="205" rx="28" fill="#0B1F3A" stroke="#1E6BF1" stroke-width="14"/>
      <path d="M402 218a28 28 0 0 1 28-28h164a28 28 0 0 1 28 28v48H402z" fill="url(#head)"/>
      <circle cx="438" cy="228" r="10" fill="#071426"/>
      <circle cx="470" cy="228" r="10" fill="#071426"/>
      <circle cx="502" cy="228" r="10" fill="#071426"/>
    </g>
  </defs>
  <circle cx="512" cy="512" r="365" fill="none" stroke="url(#ring)" stroke-width="64"/>
  <g fill="none" stroke="#1F5BD7" stroke-width="66" stroke-linecap="round">
    <path d="M512 512L799 346"/>
    <path d="M512 512L225 346"/>
    <path d="M512 512V843"/>
  </g>
  <use href="#session"/>
  <use href="#session" transform="rotate(120 512 512)"/>
  <use href="#session" transform="rotate(240 512 512)"/>
  <circle cx="512" cy="512" r="91" fill="url(#ring)"/>
  <circle cx="512" cy="512" r="58" fill="#071426"/>
  <g fill="#5EEAD4">
    <rect x="481" y="110" width="62" height="62" rx="14"/>
    <rect x="184" y="688" width="62" height="62" rx="14" transform="rotate(60 215 719)"/>
    <rect x="778" y="688" width="62" height="62" rx="14" transform="rotate(-60 809 719)"/>
  </g>
