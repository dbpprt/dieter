syntax = "proto3";

package dieter.v1;

option go_package = "github.com/dbpprt/dieter/internal/gen/dieter/v1;dieterv1";
option java_multiple_files = true;
option java_package = "com.getdieter.api.v1";

import "dieter/v1/common.proto";
import "google/protobuf/empty.proto";

// Daemon settings, prompts and the harness catalog.
service SettingsService {
  rpc GetClaudeDesignStatus(google.protobuf.Empty) returns (ClaudeDesignStatus);
  rpc SignInClaudeDesign(SignInClaudeDesignRequest) returns (stream ClaudeDesignSignInEvent);
  rpc SubmitClaudeDesignSignInCode(SubmitClaudeDesignSignInCodeRequest) returns (google.protobuf.Empty);
  rpc SetClaudeDesignAccess(SetClaudeDesignAccessRequest) returns (ClaudeDesignStatus);
  rpc GetHarnesses(google.protobuf.Empty) returns (HarnessCatalog);
  rpc GetSettings(google.protobuf.Empty) returns (Settings);
  rpc GetSettingsOptions(google.protobuf.Empty) returns (SettingsOptions);
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings);
  rpc GetPromptSettings(google.protobuf.Empty) returns (PromptSettings);
  rpc UpdatePromptSettings(UpdatePromptSettingsRequest) returns (PromptSettings);
  rpc SetProjectPromptTemplate(SetScopedPromptTemplateRequest) returns (Project);
  rpc SetBoardPromptTemplate(SetScopedPromptTemplateRequest) returns (Board);
  rpc PreviewPrompt(PreviewPromptRequest) returns (PromptPreview);
}

message HarnessCatalog {
  repeated Harness harnesses = 1;
}

message Harness {
  string id = 1;
  string name = 2;
  string default_model = 3;
  repeated HarnessModel models = 4;
  EffortConfig effort = 5;
  repeated HarnessCapability capabilities = 6;
  repeated ProviderOption options = 7;
}

message ProviderOption {
  string id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string default_value = 5;
  repeated ProviderOptionChoice choices = 6;
  bool mutable = 7;
  repeated string models = 8;
}

message ProviderOptionChoice {
  string value = 1;
  string name = 2;
}

message HarnessCapability {
  string id = 1;
  string level = 2;
}

message HarnessModel {
  string id = 1;
  string name = 2;
  int32 context_window = 3;
  string default_effort = 4;
  repeated string efforts = 5;
}

message EffortConfig {
  string label = 1;
  repeated EffortOption options = 2;
}

message Settings {
  string prompt_template = 5;
  string board_skill_template = 6;
  string chat_skill_template = 7;
  string updated_at = 4;
}

message SettingsOptions {
  repeated Project projects = 1;
  repeated Board boards = 2;
  HarnessCatalog agents = 3;
}

message UpdateSettingsRequest {
  Settings settings = 1;
}

message PromptSettings {
  string prompt_template = 1;
  string board_skill_template = 2;
  string chat_skill_template = 3;
  repeated string variables = 4;
}

message UpdatePromptSettingsRequest {
  string prompt_template = 1;
  string board_skill_template = 2;
  string chat_skill_template = 3;
}

message SetScopedPromptTemplateRequest {
  string scope_id = 1;
  bool inherit = 2;
  string prompt_template = 3;
}

message PreviewPromptRequest {
  string project_id = 1;
  string board_id = 2;
  string card_id = 3;
  repeated string label_ids = 4;
  string scope = 5;
}

message PromptPreview {
  string source = 1;
  string prompt_template = 2;
  string context = 3;
  string skill = 4;
  string instructions = 5;
  repeated Label applied_labels = 6;
  int32 characters = 7;
  int32 estimated_tokens = 8;
}

message EffortOption {
  string id = 1;
  string name = 2;
}

message ClaudeDesignStatus {
  // Claude Design is enabled for the host's Claude account and Claude Code build.
  bool available = 1;
  // Claude Design sign-in stored a design credential on the host.
  bool signed_in = 2;
  // This host can run the Claude Design sign-in.
  bool can_sign_in = 3;
  // Claude Code turns on this machine may use the Claude Design tools.
  bool access_enabled = 4;
  string access_updated_at = 5;
  // Why Claude Design is unavailable or cannot sign in, when Claude Code says.
  string reason = 6;
  // The pinned Claude Code release Dieter uses on this machine.
  string claude_code_version = 7;
  // False until the first sign-in or Claude Code turn installs that release.
  bool runtime_ready = 8;
  bool sign_in_active = 9;
}

message SignInClaudeDesignRequest {}

// The first event carries only sign_in_id. A preparing event reports that the
// pinned Claude Code release is being installed. A pages event carries url,
// which completes in a browser on the daemon host, and manual_url, whose page
// shows an authorization code to submit with SubmitClaudeDesignSignInCode from
// any client. The last event has done set and the refreshed status.
message ClaudeDesignSignInEvent {
  string sign_in_id = 1;
  bool preparing = 2;
  string url = 3;
  string manual_url = 4;
  bool manual_first = 5;
  bool done = 6;
  bool ok = 7;
  string message = 8;
  ClaudeDesignStatus status = 9;
}

message SubmitClaudeDesignSignInCodeRequest {
  string sign_in_id = 1;
  string code = 2;
}

message SetClaudeDesignAccessRequest {
  // Enabling also grants the Claude account's agent access to Design projects,
  // which headless Claude Code turns cannot confirm interactively.
  bool enabled = 1;
  // With enabled false, also revoke that account-wide grant. This affects every
  // Claude Code session of the account, not only Dieter.
  bool revoke_grant = 2;
}
