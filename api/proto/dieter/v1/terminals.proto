syntax = "proto3";

package dieter.v1;

option go_package = "github.com/dbpprt/dieter/internal/gen/dieter/v1;dieterv1";
option java_multiple_files = true;
option java_package = "com.getdieter.api.v1";

import "google/protobuf/empty.proto";

// Persistent terminals.
service TerminalService {
  // Terminal processes are owned by the daemon, not by a client stream. A
  // client can therefore disconnect and resume output from after_sequence
  // without terminating the shell.
  rpc ListTerminals(ListTerminalsRequest) returns (TerminalsResponse);
  rpc CreateTerminal(CreateTerminalRequest) returns (Terminal);
  rpc WatchTerminal(WatchTerminalRequest) returns (stream TerminalFrame);
  rpc WriteTerminal(TerminalInputRequest) returns (Terminal);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (Terminal);
  rpc RenameTerminal(RenameTerminalRequest) returns (Terminal);
  rpc CloseTerminal(TerminalRef) returns (google.protobuf.Empty);
}

message Terminal {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string shell = 4;
  string working_directory = 5;
  string status = 6;
  int64 pid = 7;
  int32 columns = 8;
  int32 rows = 9;
  uint64 sequence = 10;
  string created_at = 11;
  string updated_at = 12;
  optional int32 exit_code = 13;
  string card_id = 14;
}

message TerminalRef {
  string terminal_id = 1;
}

message ListTerminalsRequest {
  string checkout_id = 50;
  string project_id = 1;
  string card_id = 2;
}

message TerminalsResponse {
  repeated Terminal terminals = 1;
}

message CreateTerminalRequest {
  string checkout_id = 50;
  string project_id = 1;
  string name = 2;
  string shell = 3;
  string working_directory = 4;
  int32 columns = 5;
  int32 rows = 6;
  string card_id = 7;
  // machine_home creates a host-scoped shell rooted in the daemon user's home
  // directory. It is mutually exclusive with project_id and card_id.
  bool machine_home = 8;
}

message WatchTerminalRequest {
  string terminal_id = 1;
  uint64 after_sequence = 2;
  int32 heartbeat_ms = 3;
}

message TerminalFrame {
  Terminal terminal = 1;
  uint64 sequence = 2;
  bytes data = 3;
  // Reset means the client's previous screen is stale. Clear the emulator and
  // replay data as the new bounded baseline before applying later frames.
  bool screen_reset = 4;
  bool heartbeat = 5;
}

message TerminalInputRequest {
  string terminal_id = 1;
  bytes data = 2;
}

message ResizeTerminalRequest {
  string terminal_id = 1;
  int32 columns = 2;
  int32 rows = 3;
}

message RenameTerminalRequest {
  string terminal_id = 1;
  string name = 2;
}
