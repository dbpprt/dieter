syntax = "proto3";

package dieter.v1;

option go_package = "github.com/dbpprt/dieter/internal/gen/dieter/v1;dieterv1";
option java_multiple_files = true;
option java_package = "com.getdieter.api.v1";

import "dieter/v1/common.proto";

// Repository status, changes and git operations.
service GitService {
  rpc GetWorkspace(ConversationRef) returns (Workspace);
  rpc ListProjectWorkspaces(ProjectRef) returns (WorkspacesResponse);
  rpc GetChangeset(GetChangesetRequest) returns (Changeset);
  rpc GetFileDiff(GetDiffRequest) returns (FileDiff);
  rpc GetCommitDiff(GetDiffRequest) returns (FileDiff);
  rpc AddChangeComment(AddChangeCommentRequest) returns (ChangeComment);
  rpc ListChangeComments(ListChangeCommentsRequest) returns (ChangeCommentsResponse);
  rpc GetSCMCapabilities(ConversationRef) returns (SCMCapabilities);
  rpc StartGitOperation(StartGitOperationRequest) returns (GitOperation);
  rpc GetGitOperation(GitOperationRef) returns (GitOperation);
  rpc WatchGitOperation(WatchGitOperationRequest) returns (stream GitOperationFrame);
  rpc CancelGitOperation(GitOperationRef) returns (GitOperation);
  // Streams a conversation's or checkout's changes: the full changeset first,
  // then a frame whenever its revision or activity changes, plus heartbeats.
  rpc WatchChangeset(WatchChangesetRequest) returns (stream ChangesetFrame);
}

message ConversationRef {
  string card_id = 1;
}

message Workspace {
  string card_id = 1;
  string project_id = 2;
  string mode = 3;
  string path = 4;
  string base_remote = 5;
  string base_branch = 6;
  string base_sha = 7;
  string current_base_sha = 8;
  string branch = 9;
  string head_sha = 10;
  string upstream_ref = 11;
  bool managed_branch = 12;
  string state = 14;
  string revision = 15;
  string current_operation_id = 16;
  repeated string previous_card_ids = 17;
  int32 changed_files = 18;
  int32 additions = 19;
  int32 deletions = 20;
  int32 ahead = 21;
  int32 behind = 22;
  int64 size_bytes = 23;
  string created_at = 24;
  string updated_at = 25;
  string integrated_head_sha = 26;
  string integrated_result_sha = 27;
  string integration_strategy = 28;
  string integrated_at = 29;
  bool dirty = 30;
  string remote_publish_mode = 31;
}

message WorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message ChangedFile {
  string path = 1;
  string old_path = 2;
  string status = 3;
  int32 additions = 4;
  int32 deletions = 5;
  bool binary = 6;
  bool untracked = 7;
  bool conflicted = 8;
  string index_status = 9;
  string worktree_status = 10;
  bool staged = 11;
  bool unstaged = 12;
  int32 staged_additions = 13;
  int32 staged_deletions = 14;
  int32 unstaged_additions = 15;
  int32 unstaged_deletions = 16;
  // Changes whenever this file's HEAD, index or working-tree state changes,
  // and only then. File-scoped operations use it as their precondition.
  string revision = 17;
}

message WorkspaceCommit {
  string sha = 1;
  string short_sha = 2;
  string subject = 3;
  string author_name = 4;
  string author_email = 5;
  string authored_at = 6;
  int32 additions = 7;
  int32 deletions = 8;
  int32 changed_files = 9;
}

// What works in a changeset's directory right now. An active agent is a
// state to show, never a reason to refuse a read.
message ChangesetActivity {
  bool agent_active = 1;
  repeated string agent_card_ids = 2;
}

message Changeset {
  reserved 10;
  reserved "volatile";
  string card_id = 1;
  // Detects any change in the directory. It guards only operations that act
  // on the whole tree; reads never need it.
  string revision = 2;
  string comparison_sha = 3;
  string head_sha = 4;
  string base_sha = 5;
  repeated ChangedFile files = 6;
  repeated WorkspaceCommit commits = 7;
  int32 additions = 8;
  int32 deletions = 9;
  string generated_at = 11;
  string project_id = 12;
  string branch = 13;
  string base_branch = 14;
  int32 ahead = 15;
  int32 behind = 16;
  bool dirty = 17;
  bool conflicted = 18;
  string current_operation_id = 19;
  // "worktree" for a conversation's own worktree, "checkout" for a project
  // checkout, including one a project-directory conversation works in.
  string scope = 20;
  string checkout_id = 21;
  // Changes whenever the staged content changes; a commit of the index uses
  // it as its precondition.
  string index_fingerprint = 22;
  ChangesetActivity activity = 23;
  // The file list stops at a bound; total_files counts every changed file.
  bool files_truncated = 24;
  int32 total_files = 25;
}

message GetChangesetRequest {
  string checkout_id = 50;
  string card_id = 1;
  string project_id = 2;
}

message GetDiffRequest {
  reserved 4;
  reserved "expected_revision";
  string checkout_id = 50;
  string card_id = 1;
  string path = 2;
  string commit_sha = 3;
  int64 offset = 5;
  int32 limit = 6;
  string project_id = 7;
  // combined compares HEAD to the working tree, staged compares HEAD to the
  // index, and unstaged compares the index to the working tree.
  string section = 8;
  // The file revision of the pages already read; a later page comes from the
  // same rendering, or the diff restarts when the file changed.
  string file_revision = 9;
}

message FileDiff {
  string card_id = 1;
  string path = 2;
  string commit_sha = 3;
  string revision = 4;
  string patch = 5;
  bool binary = 6;
  bool truncated = 7;
  int64 next_offset = 8;
  int64 total_bytes = 9;
  string project_id = 10;
  string section = 11;
  // The file's revision this patch shows.
  string file_revision = 12;
  // The file changed since the earlier pages; this is the first page of its
  // new diff.
  bool restarted = 13;
}

message ChangeComment {
  string id = 1;
  string card_id = 2;
  string path = 3;
  string side = 4;
  int32 line = 5;
  string body = 6;
  string author = 7;
  // The revision of the file the comment was written against; the comment is
  // outdated once the file changes.
  string file_revision = 8;
  string commit_sha = 9;
  string created_at = 10;
  string updated_at = 11;
}

message AddChangeCommentRequest {
  string card_id = 1;
  string path = 2;
  string side = 3;
  int32 line = 4;
  string body = 5;
  string author = 6;
  string file_revision = 7;
  string commit_sha = 8;
}

message ListChangeCommentsRequest {
  reserved 2;
  reserved "revision";
  string card_id = 1;
}

message ChangeCommentsResponse {
  repeated ChangeComment comments = 1;
}

message SCMCapabilities {
  string provider = 1;
  string remote = 2;
  string host = 3;
  string owner = 4;
  string repository = 5;
  bool remote_available = 6;
  bool push_available = 7;
  bool provider_api_available = 8;
  bool authenticated = 9;
  string unavailable_reason = 10;
}

message GitConflict {
  string path = 1;
  int32 hunk_count = 2;
}

message ValidationResult {
  string name = 1;
  int32 exit_code = 2;
  string output = 3;
  bool truncated = 4;
  int64 duration_ms = 5;
}

message GitOperation {
  string id = 1;
  string card_id = 2;
  string project_id = 3;
  string kind = 4;
  string status = 5;
  string expected_revision = 6;
  string expected_base_sha = 7;
  string expected_head_sha = 8;
  map<string, string> parameters = 9;
  repeated string completed_steps = 10;
  repeated ValidationResult validation_results = 11;
  repeated GitConflict conflicts = 12;
  string result = 13;
  string error = 14;
  uint64 sequence = 15;
  string created_at = 16;
  string started_at = 17;
  string finished_at = 18;
  string updated_at = 19;
  map<string, string> expected_files = 20;
  string expected_index = 21;
  // The project-directory conversation that started this checkout operation.
  string requested_by_card_id = 22;
}

message StartGitOperationRequest {
  string checkout_id = 50;
  string card_id = 1;
  string kind = 2;
  // Guards operations on the whole tree (stage_all commits, merges, cleanup).
  string expected_revision = 3;
  map<string, string> parameters = 4;
  string project_id = 5;
  // Path to ChangedFile.revision for exactly the files stage, unstage and
  // discard_changes act on; they fail only when one of these files changed.
  map<string, string> expected_files = 6;
  // Changeset.index_fingerprint for a commit of the staged changes.
  string expected_index = 7;
}

message GitOperationRef {
  string operation_id = 1;
}

message WatchGitOperationRequest {
  string operation_id = 1;
  uint64 after_sequence = 2;
  int32 heartbeat_ms = 3;
}

message GitOperationLogEntry {
  uint64 sequence = 1;
  string created_at = 2;
  string message = 3;
}

message GitOperationFrame {
  GitOperation operation = 1;
  repeated GitOperationLogEntry logs = 2;
  bool heartbeat = 3;
}

message WatchChangesetRequest {
  string checkout_id = 50;
  string card_id = 1;
  string project_id = 2;
  int32 heartbeat_ms = 3;
}

message ChangesetFrame {
  Changeset changeset = 1;
  bool heartbeat = 2;
}
