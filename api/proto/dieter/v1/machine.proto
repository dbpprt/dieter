syntax = "proto3";

package dieter.v1;

option go_package = "github.com/dbpprt/dieter/internal/gen/dieter/v1;dieterv1";
option java_multiple_files = true;
option java_package = "com.getdieter.api.v1";

import "dieter/gateway/v1/gateway.proto";
import "dieter/v1/common.proto";
import "google/protobuf/empty.proto";

// Daemon health, host telemetry and machine operations.
service MachineService {
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
  rpc GetRuntimeStatus(google.protobuf.Empty) returns (RuntimeStatus);
  // Machine telemetry stays on the daemon and follows the same authenticated
  // direct-or-relay data path as every other Dieter operation.
  rpc GetMachineInformation(google.protobuf.Empty) returns (MachineInformation);
  rpc PerformMachineOperation(MachineOperationRequest) returns (MachineOperationResponse);
}

message HealthResponse {
  string status = 1;
  string release_version = 2;
  string store_path = 3;
  dieter.gateway.v1.CompatibilityPolicy compatibility_policy = 4;
}

message RuntimeStatus {
  bool ready = 1;
  string mode = 2;
  bool sandboxed = 3;
  bool node_required = 4;
}

message MachineInformation {
  string hostname = 1;
  string os_name = 2;
  string os_version = 3;
  string architecture = 4;
  string hardware_model = 5;
  string processor = 6;
  uint64 uptime_seconds = 7;
  string collected_at = 8;

  double cpu_usage_percent = 9;
  uint32 logical_cpu_count = 10;
  double load_1 = 11;
  double load_5 = 12;
  double load_15 = 13;

  uint64 memory_total_bytes = 14;
  uint64 memory_used_bytes = 15;
  uint64 memory_cached_bytes = 16;
  uint64 swap_used_bytes = 17;

  uint64 disk_total_bytes = 18;
  uint64 disk_free_bytes = 19;
  double network_receive_bytes_per_second = 20;
  double network_send_bytes_per_second = 21;
  double temperature_celsius = 22;

  repeated MachineProcess processes = 23;
  uint32 active_agent_count = 24;
  bool supports_restart = 25;
  bool supports_shutdown = 26;
  repeated double cpu_core_usage_percent = 27;
  BuildInformation daemon_build = 28;
  GPUTelemetry gpu = 29;
  repeated MachineOperationCapability operation_capabilities = 30;
  MachinePrivacy privacy = 31;
}

message BuildInformation {
  string release_version = 1;
  reserved 2;
  reserved "api_version";
  string source_revision = 3;
  string built_at = 4;
}

enum GPUTelemetryState {
  GPU_TELEMETRY_STATE_UNSPECIFIED = 0;
  GPU_TELEMETRY_STATE_UNAVAILABLE = 1;
  GPU_TELEMETRY_STATE_NO_DEVICES = 2;
  GPU_TELEMETRY_STATE_PARTIAL = 3;
  GPU_TELEMETRY_STATE_AVAILABLE = 4;
}

enum GPUVendor {
  GPU_VENDOR_UNSPECIFIED = 0;
  GPU_VENDOR_APPLE = 1;
  GPU_VENDOR_NVIDIA = 2;
  GPU_VENDOR_AMD = 3;
}

enum GPUMemoryKind {
  GPU_MEMORY_KIND_UNSPECIFIED = 0;
  GPU_MEMORY_KIND_UNIFIED = 1;
  GPU_MEMORY_KIND_DEDICATED = 2;
}

message GPUTelemetry {
  GPUTelemetryState state = 1;
  repeated GPUDevice devices = 2;
  string unavailable_reason = 3;
}

message GPUDevice {
  string id = 1;
  GPUVendor vendor = 2;
  string name = 3;
  string driver_version = 4;
  GPUMemoryKind memory_kind = 5;
  optional double utilization_percent = 6;
  optional uint64 memory_total_bytes = 7;
  optional uint64 memory_used_bytes = 8;
  optional double temperature_celsius = 9;
  optional double power_watts = 10;
  optional uint32 process_count = 11;
}

message MachineProcess {
  int64 pid = 1;
  string kind = 2;
  string name = 3;
  string detail = 4;
  double cpu_usage_percent = 5;
  uint64 memory_bytes = 6;
  string started_at = 7;
  repeated MachineProcessGPU gpu_usage = 8;
}

message MachineProcessGPU {
  string gpu_id = 1;
  optional uint64 memory_bytes = 2;
}

enum MachineOperationAction {
  MACHINE_OPERATION_ACTION_UNSPECIFIED = 0;
  MACHINE_OPERATION_ACTION_RESTART = 1;
  MACHINE_OPERATION_ACTION_SHUTDOWN = 2;
  MACHINE_OPERATION_ACTION_UPDATE_DAEMON = 3;
  MACHINE_OPERATION_ACTION_PRIVACY_ON = 4;
  MACHINE_OPERATION_ACTION_PRIVACY_OFF = 5;
  // Register the optional privileged input helper; macOS administrator approval
  // and Input Monitoring must be completed on the target Mac.
  MACHINE_OPERATION_ACTION_PRIVACY_SETUP = 6;
}

message MachineOperationRequest {
  MachineOperationAction action = 1;
  // Destructive host actions require an exact action-specific confirmation
  // phrase even after the client presents its own confirmation UI.
  string confirmation = 2;
  // Clients may repeat a request with the same key after a transport failure;
  // a different action with the same key is rejected.
  string idempotency_key = 3;
}

message MachineOperationResponse {
  bool accepted = 1;
  string message = 2;
  string operation_id = 3;
  string scheduled_at = 4;
}

message MachineOperationCapability {
  MachineOperationAction action = 1;
  bool supported = 2;
  bool authorized = 3;
  string unavailable_reason = 4;
}
