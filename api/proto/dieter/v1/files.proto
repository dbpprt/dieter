syntax = "proto3";

package dieter.v1;

option go_package = "github.com/dbpprt/dieter/internal/gen/dieter/v1;dieterv1";
option java_multiple_files = true;
option java_package = "com.getdieter.api.v1";

import "google/protobuf/empty.proto";

// Project files.
service FileService {
  rpc StatTransferFile(TransferPath) returns (TransferEntry);
  rpc ListTransferFiles(ListTransferFilesRequest) returns (TransferPage);
  rpc ReadFileChunk(ReadFileChunkRequest) returns (FileChunk);
  rpc BeginFileUpload(BeginFileUploadRequest) returns (FileUpload);
  rpc WriteFileChunk(WriteFileChunkRequest) returns (FileUpload);
  rpc GetFileUpload(FileUploadRequest) returns (FileUpload);
  rpc CommitFileUpload(FileUploadRequest) returns (FileUpload);
  rpc AbortFileUpload(FileUploadRequest) returns (FileUpload);
  rpc DeleteTransferFile(DeleteTransferFileRequest) returns (google.protobuf.Empty);
  rpc ListFiles(ListFilesRequest) returns (FileList);
  rpc ReadFile(ReadFileRequest) returns (FileDocument);
  rpc SaveFile(SaveFileRequest) returns (FileDocument);
  rpc CreateFile(CreateFileRequest) returns (FileEntry);
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (google.protobuf.Empty);
}

message ListFilesRequest {
  string checkout_id = 50;
  string project_id = 1;
  string path = 2;
  bool show_hidden = 3;
  string card_id = 4;
}

message FileEntry {
  string name = 1;
  string path = 2;
  string kind = 3;
  int64 size = 4;
  string modified_at = 5;
  bool hidden = 6;
  bool symlink = 7;
}

message FileList {
  string path = 1;
  repeated FileEntry entries = 2;
}

message ReadFileRequest {
  string checkout_id = 50;
  string project_id = 1;
  string path = 2;
  string card_id = 3;
}

message FileDocument {
  string path = 1;
  string name = 2;
  bool binary = 3;
  int64 size = 4;
  string modified_at = 5;
  string revision = 6;
  string mime_type = 7;
  string content = 8;
  bytes data = 9;
}

message SaveFileRequest {
  string checkout_id = 50;
  string project_id = 1;
  string path = 2;
  string content = 3;
  string revision = 4;
  string card_id = 5;
}

message CreateFileRequest {
  string checkout_id = 50;
  string project_id = 1;
  string path = 2;
  string kind = 3;
  string content = 4;
  string card_id = 5;
}

message MoveFileRequest {
  string checkout_id = 50;
  string project_id = 1;
  string source = 2;
  string destination = 3;
  string card_id = 4;
}

message MoveFileResponse {
  string source = 1;
  string destination = 2;
}

message DeleteFileRequest {
  string checkout_id = 50;
  string project_id = 1;
  string path = 2;
  bool recursive = 3;
  string card_id = 4;
}

// Transfer paths are relative to one immutable owner checkout or conversation.
message TransferPath {
  string project_id = 1;
  string checkout_id = 2;
  string card_id = 3;
  string path = 4;
  bool checksum = 5;
}
message TransferEntry {
  string path = 1;
  string kind = 2;
  int64 size = 3;
  int64 modified_nanos = 4;
  string revision = 5;
  string sha256 = 6;
  uint32 mode = 7;
}
message ListTransferFilesRequest {
  TransferPath target = 1;
  string after = 2;
  string revision = 3;
  int32 page_size = 4;
}
message TransferPage {
  repeated TransferEntry entries = 1;
  string next = 2;
  string revision = 3;
}
message ReadFileChunkRequest {
  TransferPath target = 1;
  string revision = 2;
  int64 offset = 3;
  int32 length = 4;
}
message FileChunk {
  bytes data = 1;
  string sha256 = 2;
}
message BeginFileUploadRequest {
  TransferPath target = 1;
  string operation_id = 2;
  // "missing" means create-only; otherwise an observed destination revision.
  string expected_revision = 3;
  int64 size = 4;
  string sha256 = 5;
  int64 modified_nanos = 6;
  uint32 mode = 7;
}
message FileUploadRequest {
  string id = 1;
}
message WriteFileChunkRequest {
  string id = 1;
  int64 offset = 2;
  bytes data = 3;
  string sha256 = 4;
}
message FileUpload {
  string id = 1;
  int64 offset = 2;
  int64 size = 3;
  string state = 4;
  int64 expires_unix = 5;
}
message DeleteTransferFileRequest {
  TransferPath target = 1;
  string revision = 2;
}
