name: Native qualification
on:
  workflow_dispatch:
    inputs:
      suite:
        description: iOS journey on the iPhone and iPad simulator layouts, and the share case on iPhone
        type: choice
        default: functional
        options: [smoke, functional]
permissions:
  contents: read
concurrency:
  group: native-e2e-ios
  cancel-in-progress: false
jobs:
  ios:
    uses: ./.github/workflows/component-check.yml
    with:
      component: ios
      runner: macos-26
      native_only: true
      native_profiles: ios-iphone,ios-ipad
      native_suite: ${{ inputs.suite }}
