name: Native E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native client
        type: choice
        default: android
        options: [android, mac, ios]
      suite:
        description: Suite (Mac/iOS support smoke and functional)
        type: choice
        default: functional
        options: [smoke, functional, sync, performance, sdk]

permissions:
  contents: read

# Explicit opt-in on a provisioned, visible host-GPU emulator. Hosted runners
# lack this repository's qualified AVD; do not substitute software rendering.
concurrency:
  group: native-e2e-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: [self-hosted, Linux, dieter-android]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable fixture runtime
        run: just harness install
      - name: Validate native test catalog
        run: just e2e lint
      - name: Execute selected Android suite
        env:
          E2E_SUITE: ${{ inputs.suite }}
          E2E_OUTPUT: tmp/native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: just e2e run --suite "$E2E_SUITE" --output "$E2E_OUTPUT"
      - name: Retain results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: tmp/native-e2e-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  mac:
    if: inputs.platform == 'mac'
    runs-on: [self-hosted, macOS, dieter-mac]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable fixture runtime
        run: just harness install
      - name: Validate native test catalog
        run: just e2e lint
      - name: Execute selected Mac suite on the visible desktop
        env:
          E2E_SUITE: ${{ inputs.suite }}
          E2E_OUTPUT: tmp/native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: just e2e run --platform mac --suite "$E2E_SUITE" --output "$E2E_OUTPUT"
      - name: Retain results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-e2e
          path: tmp/native-e2e-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Select Xcode
        run: just release select-xcode
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install disposable fixture runtime
        run: just harness install
      - name: Execute selected iOS suite
        env:
          E2E_SUITE: ${{ inputs.suite }}
          E2E_DEVICE: ${{ matrix.device }}
          E2E_OUTPUT: tmp/native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: just e2e run --platform ios --device "$E2E_DEVICE" --suite "$E2E_SUITE" --output "$E2E_OUTPUT"
      - name: Retain results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.device }}-e2e
          path: tmp/native-e2e-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
