name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Go and harness runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/harness/runtime/package-lock.json
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Install Linux screen helper build and runtime dependencies
        run: just daemon linux-ci-dependencies
      - name: Install harness runtime
        run: just harness install
      - name: Run portable checks
        run: just check
      - name: Test release signing and packaging
        run: just release test
      - name: Check gateway vulnerabilities
        run: just gateway vulncheck
      - name: Check daemon vulnerabilities
        run: just daemon vulncheck
      - name: Check bundled Markdown renderer
        run: just mac markdown-check

  macos:
    name: macOS client
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Select Xcode 26.5
        run: just release select-xcode
      - name: Verify native installer packaging
        run: just release test
      - name: Restore Swift build caches
        uses: actions/cache@v4
        with:
          path: |
            apps/mac/.build/dieter-local
            apps/mac/.build/dieter-tests
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-dieter-mac-check-v3-${{ hashFiles('apps/mac/Package.swift', 'apps/mac/Package.resolved', 'apps/mac/Vendor/**/Package.swift') }}
      - name: Check macOS client
        run: just mac check
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/harness/runtime/package-lock.json
      - name: Install isolated smoke fixture runtime
        run: just harness install
      - name: Native core gate
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: just mac smoke core
      - name: Native navigation gate
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: just mac smoke board
      - name: Complete native qualification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: just mac smoke-all
      - name: Retain native reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-native-evidence
          path: |
            apps/mac/.build/smoke/**/*.json
            apps/mac/.build/smoke/**/*.png
            apps/mac/.build/smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  ios-device:
    name: iOS client (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iphone
            device: iPhone 17 Pro
          - platform: ipad
            device: iPad Pro 11-inch (M5)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Select Xcode 26.5
        run: just release select-xcode
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/harness/runtime/package-lock.json
      - name: Restore iOS build cache
        uses: actions/cache@v4
        with:
          path: apps/ios/.build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-ios-ci-v1-${{ hashFiles('apps/mac/Package.swift', 'apps/ios/**/Package.resolved', 'apps/mac/Vendor/**/Package.swift') }}
      - name: Install isolated fixture runtime
        run: just harness install
      - name: Build signed Simulator app
        id: build_ios
        run: just ios build
      - name: Verify remote workflows
        env:
          IOS_SMOKE_DEVICE: ${{ matrix.device }}
        run: just ios smoke-built "$IOS_SMOKE_DEVICE"
      - name: Retain native results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.platform }}-evidence
          path: |
            apps/ios/.build/smoke/**/test-summary.json
            apps/ios/.build/smoke/**/passed.json
            apps/ios/.build/smoke/**/stage.log
            apps/ios/.build/smoke/**/cleanup.log
            apps/ios/.build/smoke/**/boot.log
            apps/ios/.build/smoke/**/gateway.log
            apps/ios/.build/smoke/**/tests.log
            apps/ios/.build/smoke/**/failure-console.log
            apps/ios/.build/smoke/**/attachments/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify unsigned device archive
        if: ${{ !cancelled() && steps.build_ios.conclusion == 'success' && matrix.platform == 'iphone' }}
        run: just ios archive-unsigned 0.1.0 1

  ios:
    name: iPhone and iPad client
    needs: ios-device
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Require both device journeys
        env:
          IOS_DEVICE_RESULT: ${{ needs.ios-device.result }}
        run: just ios ci-smoke-result

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          # Dieter installs its exact SDK packages in the next step. The
          # action's default still includes the retired `tools` package.
          packages: ""
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Install Android SDK packages
        run: just android install-sdk
      - name: Check Android client
        run: just android check
