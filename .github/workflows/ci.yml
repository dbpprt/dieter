name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Go and harness runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/harness/runtime/package-lock.json
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Install harness runtime
        run: just harness install
      - name: Run portable checks
        run: just check

  macos:
    name: macOS client
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Select Xcode 26.3
        run: just release select-xcode
      - name: Restore Swift build cache
        uses: actions/cache@v4
        with:
          path: apps/mac/.build/dieter-local
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-dieter-mac-test-v1-${{ hashFiles('apps/mac/Package.swift', 'apps/mac/Package.resolved', 'apps/mac/Vendor/**/Package.swift') }}
      - name: Check macOS client
        run: just mac check

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Install Android SDK packages
        run: just android install-sdk
      - name: Check Android client
        run: just android check
