name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualification:
    name: Qualification
    uses: ./.github/workflows/qualification.yml
    with:
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  release:
    name: Development release
    needs: qualification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      channel: dev
    secrets: inherit
  compose-previews:
    name: Deliver Compose previews
    needs: qualification
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.qualification.outputs.compose_android_preview != '' || needs.qualification.outputs.compose_ios_preview != '')
    uses: ./.github/workflows/compose-mobile-deliver.yml
    with:
      android_artifact: ${{ needs.qualification.outputs.compose_android_preview }}
      ios_artifact: ${{ needs.qualification.outputs.compose_ios_preview }}
