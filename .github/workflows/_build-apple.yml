name: Build Apple

# The Apple signing domain: the notarized Mac app, the App Store IPA and the
# notarized darwin daemon (tarball + side-by-side pkg + the prebuilt harness
# runtime archive it pins). The signing jobs reference the `apple-signing`
# environment (main only), which holds the signing secrets. The harness runtime
# archive runs third-party installers, so `harness-runtime` builds it without
# secrets and hands it to `daemon`.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build:
        type: string
        required: true

permissions:
  contents: read

env:
  FASTLANE_DISABLE_COLORS: "1"
  FASTLANE_HIDE_TIMESTAMP: "true"
  FASTLANE_OPT_OUT_USAGE: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  NO_COLOR: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  DIETER_RELEASE_VERSION: ${{ inputs.version }}
  DIETER_RELEASE_BUILD: ${{ inputs.build }}

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 75
    environment: apple-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: java node ruby gem:bundler xcbeautify
          bundle: "true"
          cache-scope: release
      - name: Developer ID app, notarized and stapled
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bundle exec fastlane mac release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mac
          path: dist/apple/Dieter-macOS-arm64.zip
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  ios:
    runs-on: macos-26
    timeout-minutes: 75
    environment: apple-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: java ruby gem:bundler xcbeautify
          bundle: "true"
          cache-scope: release
      - name: App Store IPA
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
        run: bundle exec fastlane ios release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios
          path: dist/ios/Dieter-iOS.ipa
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  harness-runtime:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go node ruby gem:bundler
          bundle: "true"
      - name: Harness runtime archive
        run: bundle exec fastlane mac harness_runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-runtime-darwin
          path: dist/harness-runtime/dieter-harness-runtime-darwin-arm64.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  daemon:
    needs: harness-runtime
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: go ruby gem:bundler
          bundle: "true"
          cache-scope: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harness-runtime-darwin
          path: dist/harness-runtime
      - name: Notarized darwin daemon tarball and installer
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bundle exec fastlane mac daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-daemon-darwin
          path: |
            dist/daemon/dieter-darwin-arm64.tar.gz
            dist/daemon/dieter-darwin-arm64.pkg
            dist/daemon/dieter-harness-runtime-darwin-arm64.tar.gz
          retention-days: 30
          if-no-files-found: error
