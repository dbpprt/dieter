name: Release coordination
on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: dev
      identity_artifact:
        required: true
        type: string
    outputs:
      tag:
        value: ${{ jobs.publish.outputs.tag }}
        description: Exact retained release tag
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: distribution
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.identity_artifact }}
          path: tmp/release-identity
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and sign exact retained candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: just pipeline release action:assemble identity:tmp/release-identity/identity.json
      - name: Publish the selected development visibility
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_CHANNEL: ${{ inputs.channel }}
        run: just pipeline release action:publish identity:tmp/release-identity/identity.json channel:"$PIPELINE_CHANNEL"
      - name: Collect bounded coordination diagnostics
        if: always()
        run: just pipeline ci action:evidence component:report output:tmp/coordination-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: release-coordination-evidence-${{ github.run_attempt }}
          path: tmp/coordination-evidence/
          retention-days: 14
          if-no-files-found: error
