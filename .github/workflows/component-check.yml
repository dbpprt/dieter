name: Component check
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      runner:
        type: string
        required: true
      native_cases:
        type: string
        default: ""
      native_suite:
        type: string
        default: ""
      native_profile:
        type: string
        default: ""
      native_profiles:
        description: Simulator profiles sharing one verified build on the same worker
        type: string
        default: ""
      native_only:
        type: boolean
        default: false
      full:
        description: Include release-only variant compilation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: ${{ inputs.component }}
          fixture: "true"
          native: ${{ inputs.native_cases != '' || inputs.native_suite != '' }}
      - uses: ./.github/actions/apple-check-cache
        if: runner.environment == 'github-hosted' && (inputs.component == 'mac' || inputs.component == 'ios')
        with:
          component: ${{ inputs.component }}
      - name: Run component checks
        if: ${{ !inputs.native_only }}
        env:
          PIPELINE_COMPONENT: ${{ inputs.component }}
          PIPELINE_CASES: ${{ inputs.native_cases }}
          PIPELINE_SUITE: ${{ inputs.native_suite }}
          PIPELINE_PROFILE: ${{ inputs.native_profile }}
          PIPELINE_PROFILES: ${{ inputs.native_profiles }}
          PIPELINE_FULL: ${{ inputs.full }}
          CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIETER_APPLE_CHECK_CACHE: "true"
        run: just pipeline ci action:check component:"$PIPELINE_COMPONENT" full:"$PIPELINE_FULL" cases:"$PIPELINE_CASES" suite:"$PIPELINE_SUITE" profile:"$PIPELINE_PROFILE" profiles:"$PIPELINE_PROFILES"
      - name: Execute required native cases
        if: inputs.native_only && (inputs.native_cases != '' || inputs.native_suite != '')
        env:
          PIPELINE_COMPONENT: ${{ inputs.component }}
          PIPELINE_CASES: ${{ inputs.native_cases }}
          PIPELINE_SUITE: ${{ inputs.native_suite }}
          PIPELINE_PROFILE: ${{ inputs.native_profile }}
          PIPELINE_PROFILES: ${{ inputs.native_profiles }}
          DIETER_APPLE_CHECK_CACHE: "true"
        run: just pipeline native_ci component:"$PIPELINE_COMPONENT" cases:"$PIPELINE_CASES" suite:"$PIPELINE_SUITE" profile:"$PIPELINE_PROFILE" profiles:"$PIPELINE_PROFILES"
      - name: Collect bounded diagnostic evidence
        if: always()
        run: just pipeline ci action:evidence component:report output:tmp/ci-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-${{ inputs.component }}-${{ inputs.runner }}-${{ inputs.native_profile }}-${{ github.run_attempt }}
          path: tmp/ci-evidence/
          retention-days: 14
          if-no-files-found: error
