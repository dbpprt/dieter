name: Component check
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      runner:
        type: string
        required: true
      e2e:
        description: Maestro flow tags to run (smoke or full); empty runs none
        type: string
        default: ""
      profile:
        description: Device profiles for the Maestro run, comma-separated
        type: string
        default: ""
      full:
        description: Include release-only variant compilation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: ${{ inputs.component }}
          fixture: "true"
          native: ${{ inputs.e2e != '' }}
      - uses: ./.github/actions/apple-check-cache
        if: runner.environment == 'github-hosted' && (inputs.component == 'mac' || inputs.component == 'ios')
        with:
          component: ${{ inputs.component }}
      - name: Run component checks
        env:
          PIPELINE_COMPONENT: ${{ inputs.component }}
          PIPELINE_E2E: ${{ inputs.e2e }}
          PIPELINE_PROFILE: ${{ inputs.profile }}
          PIPELINE_FULL: ${{ inputs.full }}
          CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIETER_APPLE_CHECK_CACHE: "true"
        run: just pipeline ci action:check component:"$PIPELINE_COMPONENT" full:"$PIPELINE_FULL" e2e:"$PIPELINE_E2E" profile:"$PIPELINE_PROFILE"
      - name: Collect bounded diagnostic evidence
        if: always()
        run: just pipeline ci action:evidence component:report output:tmp/ci-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: check-${{ inputs.component }}-${{ inputs.runner }}-${{ github.run_attempt }}
          path: tmp/ci-evidence/
          retention-days: 14
          if-no-files-found: error
