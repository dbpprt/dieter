name: Site

# Deploys site/ to GitHub Pages from main, in the identity's repository only.
# Pull requests build and link-check the site in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/brand/**"
      - "justfile"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      upstream: ${{ steps.upstream.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: upstream
        run: echo "upstream=$([[ "$GITHUB_REPOSITORY" == "$(jq -r .repository config/identity.json)" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          tools: hugo-extended python just
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and check
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: just site-check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    needs: build
    if: needs.build.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      # OIDC acquisition can time out before a deployment exists; retry the same
      # artifact once. A second failure fails the workflow.
      - id: retry
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
