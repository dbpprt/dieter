name: Deploy getdieter.com

# Builds the Hugo site in landingpage/ and publishes it to GitHub Pages.
# The base URL is taken from the Pages configuration, so this works unchanged at
# the project-pages subpath today and at the getdieter.com custom domain later.

on:
  push:
    branches: [main]
    paths:
      - "landingpage/**"
      - "justfile"
      - "just/site.just"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Install Hugo (extended)
        run: just site install-ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: just site build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landingpage/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
