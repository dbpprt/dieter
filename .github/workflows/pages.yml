name: Deploy getdieter.com

# Builds the Hugo site in landingpage/ and publishes it to GitHub Pages.
# The base URL comes from the Pages configuration. The custom domain is
# getdieter.com; local previews can still supply another SITE_BASE_URL.

on:
  push:
    branches: [main]
    paths:
      - "landingpage/**"
      - "justfile"
      - "just/site.just"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.58.0"

      - name: Install Hugo (extended)
        run: just site install-ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: just site check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: landingpage/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      # OIDC acquisition can time out before a deployment is created. Retry the
      # same immutable artifact once; a second failure must fail the workflow.
      - name: Retry Pages deployment
        id: retry
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
