name: Promote stable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact qualified development release to promote without rebuilding
        required: true
        type: string
permissions:
  contents: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stable-release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: distribution
      - name: Verify retained qualification and promote exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PIPELINE_RELEASE_TAG: ${{ inputs.tag }}
          IOS_APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_BASE64 }}
          IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: just pipeline release action:promote tag:"$PIPELINE_RELEASE_TAG"
