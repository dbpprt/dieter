name: Prepare gateway deployment
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact promoted stable release; retain verified bytes for operator admission
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gateway-production-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gateway-production
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: distribution
      - name: Verify retained signed digests and pin the deployment release
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_RELEASE_TAG: ${{ inputs.tag }}
        run: just pipeline release action:gateway_prepare tag:"$PIPELINE_RELEASE_TAG" output:tmp/gateway-deployment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-gateway-distribution-${{ github.run_attempt }}
          path: |
            tmp/gateway-deployment/dieter-gateway-deploy.tar.gz
            tmp/gateway-deployment/gateway-manifest.json
            tmp/gateway-deployment/gateway-manifest.sigstore.json
            tmp/gateway-deployment/gateway-release.lock.json
            tmp/gateway-deployment/gateway-deployment-plan.json
          retention-days: 90
          if-no-files-found: error
