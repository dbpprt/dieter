name: Gateway image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "api/**"
      - "cmd/dieter-gateway/**"
      - "internal/daemon/**"
      - "internal/gateway/**"
      - "internal/gen/dieter/gateway/**"
      - "internal/linkauth/**"
      - "internal/rpcraw/**"
      - "internal/trust/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.gateway"
      - "justfile"
      - "just/gateway.just"
      - ".github/workflows/gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dieter-gateway-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/dbpprt/dieter-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - name: Build and publish image
        env:
          GATEWAY_IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          GATEWAY_IMAGE_LABELS: ${{ steps.metadata.outputs.labels }}
        run: just --yes gateway image-publish
