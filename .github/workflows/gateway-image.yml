name: Gateway distribution

on:
  workflow_call:
    inputs:
      source_revision:
        type: string
        required: true
      release_version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact current main commit to publish
        type: string
        required: true
      release_version:
        description: Immutable release version (for example main-0123456789ab)
        type: string
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: gateway-distribution-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.source_revision == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.58.0"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install checksum-pinned publishing tools
        run: just gateway publisher-tools
      - name: Test gateway
        run: just gateway test
      - name: Check known gateway vulnerabilities
        run: just gateway vulncheck
      - name: Test deployment controls
        run: just gateway deployment-test
      - name: Exercise real gateway and TURN transports
        run: just gateway deployment-integration
      - name: Publish signed image and bundle
        env:
          GATEWAY_RELEASE_VERSION: ${{ inputs.release_version }}
        run: just gateway publish-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dieter-gateway-deployment
          path: |
            dist/dieter-gateway-deploy.tar.gz
            dist/gateway-manifest.json
            dist/gateway-manifest.sigstore.json
            dist/gateway-release.lock.json
          if-no-files-found: error
          retention-days: 90
