name: iOS TestFlight
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact already prepared GitHub release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  distribute:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-distribute.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
