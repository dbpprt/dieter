name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Main build visibility (dev publishes a prerelease)
        type: choice
        default: dev
        options: [dev, draft]
permissions:
  contents: read
# Different main revisions never share a pending concurrency slot.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reserve:
    name: Reserve immutable development identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
      identity_artifact: release-identity-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: distribution
      - name: Reserve tag, counters and draft before candidate work
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: just pipeline release action:reserve output:tmp/release-identity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity-${{ github.run_attempt }}
          path: tmp/release-identity/identity.json
          retention-days: 90
          if-no-files-found: error
  check-portable:
    name: Go and harness runtime
    needs: reserve
    uses: ./.github/workflows/component-check.yml
    with:
      component: portable
      runner: ubuntu-latest
  check-core:
    name: Shared Kotlin core
    needs: reserve
    uses: ./.github/workflows/component-check.yml
    with:
      component: core
      runner: ubuntu-latest
  check-android:
    name: Android client
    needs: reserve
    uses: ./.github/workflows/component-check.yml
    with:
      component: android
      runner: ubuntu-latest
  check-mac:
    name: macOS client
    needs: reserve
    uses: ./.github/workflows/component-check.yml
    with:
      component: mac
      runner: macos-26
      native_cases: mac.core,mac.board
  check-core-apple:
    name: Shared Kotlin core on Apple
    needs: reserve
    uses: ./.github/workflows/component-check.yml
    with:
      component: core-apple
      runner: macos-26
  check-ios:
    name: iPhone and iPad client
    needs: reserve
    strategy:
      fail-fast: false
      matrix:
        profile: [ios-iphone, ios-ipad]
    uses: ./.github/workflows/component-check.yml
    with:
      component: ios
      runner: macos-26
      native_suite: functional
      native_profile: ${{ matrix.profile }}
  candidates:
    name: ${{ matrix.name }}
    needs: [reserve, check-portable, check-core, check-core-apple, check-android, check-mac, check-ios]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: daemon-linux-amd64
            component: daemon
            runner: ubuntu-latest
          - name: daemon-linux-arm64
            component: daemon
            runner: ubuntu-24.04-arm
          - name: daemon-darwin-arm64
            component: daemon
            runner: macos-26
          - name: gateway-linux-amd64
            component: gateway
            runner: ubuntu-latest
          - name: gateway-linux-arm64
            component: gateway
            runner: ubuntu-24.04-arm
          - name: gateway-oci
            component: gateway-oci
            runner: ubuntu-latest
          - name: android
            component: android
            runner: ubuntu-latest
          - name: mac
            component: mac
            runner: macos-26
          - name: ios
            component: ios
            runner: macos-26
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/component-candidate.yml
    with:
      component: ${{ matrix.component }}
      source: ${{ github.sha }}
      runner: ${{ matrix.runner }}
      identity_artifact: ${{ needs.reserve.outputs.identity_artifact }}
    secrets: inherit
  coordinate:
    needs: [reserve, candidates]
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-coordinate.yml
    with:
      channel: ${{ inputs.channel || 'dev' }}
      identity_artifact: ${{ needs.reserve.outputs.identity_artifact }}
    secrets: inherit
  distribute:
    needs: [reserve, coordinate]
    if: github.event_name == 'push' || inputs.channel == 'dev'
    permissions:
      contents: write
    uses: ./.github/workflows/release-distribute.yml
    with:
      tag: ${{ needs.reserve.outputs.tag }}
    secrets: inherit
