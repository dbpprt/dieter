name: Development release
on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: dev
  workflow_dispatch:
    inputs:
      channel:
        description: Main build visibility (dev publishes a prerelease)
        type: choice
        default: dev
        options: [dev, draft]
permissions:
  contents: read
# Different main revisions never share a pending concurrency slot.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  manual-qualification:
    name: Qualify manual release
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/qualification.yml
    with:
      full: true
  reserve:
    name: Reserve immutable development identity
    needs: manual-qualification
    if: always() && github.ref == 'refs/heads/main' && (needs.manual-qualification.result == 'success' || (github.event_name == 'push' && needs.manual-qualification.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
      identity_artifact: release-identity-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: distribution
      - name: Reserve tag, counters and draft before candidate work
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: just pipeline release action:reserve output:tmp/release-identity
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-identity-${{ github.run_attempt }}
          path: tmp/release-identity/identity.json
          retention-days: 90
          if-no-files-found: error
  candidates:
    name: ${{ matrix.name }}
    needs: reserve
    if: always() && needs.reserve.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: daemon-linux-amd64
            component: daemon
            runner: ubuntu-latest
          - name: daemon-linux-arm64
            component: daemon
            runner: ubuntu-24.04-arm
          - name: daemon-darwin-arm64
            component: daemon
            runner: macos-26
          - name: gateway-linux-amd64
            component: gateway
            runner: ubuntu-latest
          - name: gateway-linux-arm64
            component: gateway
            runner: ubuntu-24.04-arm
          - name: gateway-oci
            component: gateway-oci
            runner: ubuntu-latest
          - name: android
            component: android
            runner: ubuntu-latest
          - name: mac
            component: mac
            runner: macos-26
          - name: ios
            component: ios
            runner: macos-26
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/component-candidate.yml
    with:
      component: ${{ matrix.component }}
      source: ${{ github.sha }}
      runner: ${{ matrix.runner }}
      identity_artifact: ${{ needs.reserve.outputs.identity_artifact }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ matrix.component == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ matrix.component == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ matrix.component == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ matrix.component == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
      IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ matrix.component == 'ios' && secrets.IOS_APP_STORE_CONNECT_ISSUER_ID || '' }}
      IOS_APP_STORE_CONNECT_KEY_BASE64: ${{ matrix.component == 'ios' && secrets.IOS_APP_STORE_CONNECT_KEY_BASE64 || '' }}
      IOS_APP_STORE_CONNECT_KEY_ID: ${{ matrix.component == 'ios' && secrets.IOS_APP_STORE_CONNECT_KEY_ID || '' }}
      IOS_BUNDLE_ID: ${{ matrix.component == 'ios' && secrets.IOS_BUNDLE_ID || '' }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ matrix.component == 'ios' && secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 || '' }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ matrix.component == 'ios' && secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD || '' }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ matrix.component == 'ios' && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
      IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ matrix.component == 'ios' && secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 || '' }}
      IOS_TEAM_ID: ${{ matrix.component == 'ios' && secrets.IOS_TEAM_ID || '' }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ (matrix.component == 'mac' || (matrix.component == 'daemon' && matrix.runner == 'macos-26')) && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 || '' }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ (matrix.component == 'mac' || (matrix.component == 'daemon' && matrix.runner == 'macos-26')) && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
      MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ (matrix.component == 'daemon' && matrix.runner == 'macos-26') && secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 || '' }}
      MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ (matrix.component == 'daemon' && matrix.runner == 'macos-26') && secrets.MACOS_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD || '' }}
      MACOS_NOTARY_ISSUER_ID: ${{ (matrix.component == 'mac' || (matrix.component == 'daemon' && matrix.runner == 'macos-26')) && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
      MACOS_NOTARY_KEY_BASE64: ${{ (matrix.component == 'mac' || (matrix.component == 'daemon' && matrix.runner == 'macos-26')) && secrets.MACOS_NOTARY_KEY_BASE64 || '' }}
      MACOS_NOTARY_KEY_ID: ${{ (matrix.component == 'mac' || (matrix.component == 'daemon' && matrix.runner == 'macos-26')) && secrets.MACOS_NOTARY_KEY_ID || '' }}
  coordinate:
    needs: [reserve, candidates]
    if: always() && needs.reserve.result == 'success' && needs.candidates.result == 'success'
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-coordinate.yml
    with:
      channel: ${{ inputs.channel || 'dev' }}
      identity_artifact: ${{ needs.reserve.outputs.identity_artifact }}
  distribute:
    needs: [reserve, coordinate]
    if: always() && needs.reserve.result == 'success' && needs.coordinate.result == 'success' && (github.event_name == 'push' || inputs.channel == 'dev')
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-distribute.yml
    with:
      tag: ${{ needs.reserve.outputs.tag }}
    secrets:
      IOS_APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_BASE64 }}
      IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
      IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
  required:
    name: Required release stages
    needs: [reserve, candidates, coordinate, distribute]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pipeline-setup
        with:
          component: report
      - name: Require candidates, publication and requested delivery
        env:
          PIPELINE_JOB_RESULTS: ${{ toJSON(needs) }}
          PIPELINE_CHANNEL: ${{ github.event_name == 'push' && 'dev' || inputs.channel || 'dev' }}
        run: just pipeline ci action:release_gate component:report channel:"$PIPELINE_CHANNEL"
