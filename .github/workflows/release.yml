name: Release

# The only workflow that signs Dieter releases. Its identity,
#   https://github.com/<repository>/.github/workflows/release.yml@refs/heads/main
# is a public contract: installers and updaters verify SHA256SUMS, the gateway
# image and the deployment bundle against exactly this signer (Sigstore keyless).
#
# dev: nightly.yml calls it after full qualification (or dispatch on main): reserve
#   the next version, build per signing domain, publish a prerelease, TestFlight.
# stable: dispatch with the tested dev tag; promotes those exact bytes.
#
# Signing jobs run in GitHub environments (apple-signing, android-signing,
# stable-release) restricted to main. The signing secrets are repository
# secrets today, so the builder calls inherit them; once they are moved into
# those environments, drop `secrets: inherit`.
on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: dev
      qualified_by:
        description: URL of the qualifying run
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      channel:
        description: dev builds and publishes a prerelease of main; stable promotes `tag`
        type: choice
        options: [dev, stable]
        default: dev
      tag:
        description: "stable only: the tested dev release to promote (vX.Y.Z)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  FASTLANE_DISABLE_COLORS: "1"
  FASTLANE_HIDE_TIMESTAMP: "true"
  FASTLANE_OPT_OUT_USAGE: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  NO_COLOR: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  version:
    if: inputs.channel != 'stable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One reservation at a time keeps the counter monotonic without claim tags.
    concurrency:
      group: release-version
      cancel-in-progress: false
    outputs:
      exists: ${{ steps.reserve.outputs.exists }}
      version: ${{ steps.reserve.outputs.version }}
      build: ${{ steps.reserve.outputs.build }}
      tag: ${{ steps.reserve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # pushes the version tag
      - name: Only the identity's repository releases
        run: |
          upstream=$(jq -r .repository config/identity.json)
          [[ "$GITHUB_REPOSITORY" == "$upstream" ]] || { echo "::error::Releases run only in $upstream (config/identity.json)"; exit 1; }
      - uses: ./.github/actions/setup
        with:
          tools: ruby gem:bundler
          bundle: "true"
      - name: Reserve the next version
        id: reserve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bundle exec fastlane version

  server:
    needs: version
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-server.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}

  apple:
    needs: version
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-apple.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}
    secrets: inherit

  android:
    needs: version
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-android.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}
    secrets: inherit

  publish:
    needs: [version, server, apple, android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # the gateway image and deployment bundle
      id-token: write # Sigstore keyless signing and attestations
      attestations: write
    env:
      DIETER_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DIETER_RELEASE_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identity
        id: identity
        run: |
          [[ "$GITHUB_REPOSITORY" == "$(jq -r .repository config/identity.json)" ]]
          echo "image=$(jq -r .container_registry config/identity.json)/dieter-gateway" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          tools: ruby gem:bundler python cosign oras
          bundle: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/built
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Gateway image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.identity.outputs.image }}:${{ env.DIETER_RELEASE_VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RELEASE_VERSION=${{ env.DIETER_RELEASE_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
            BUILT_AT=${{ steps.identity.outputs.built_at }}
      - name: Sign the image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes -a "sourceRevision=$GITHUB_SHA" "$IMAGE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Signed gateway deployment bundle
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          BUILT_AT: ${{ steps.identity.outputs.built_at }}
        run: |
          probes=(); for probe in dist/built/gateway-turn-probe-*; do probes+=(--probe "$probe"); done
          python3 deploy/gateway/scripts/bundle.py pack --output dist/gateway --revision "$GITHUB_SHA" \
            --version "$DIETER_RELEASE_VERSION" --image "$IMAGE" --built-at "$BUILT_AT" "${probes[@]}"
          cosign sign-blob --yes --bundle dist/gateway/gateway-manifest.sigstore.json dist/gateway/gateway-manifest.json
          python3 deploy/gateway/scripts/bundle.py push dist/gateway --revision "$GITHUB_SHA" --version "$DIETER_RELEASE_VERSION"
      - name: Assets, SHA256SUMS and its signature
        run: |
          mkdir -p dist/release
          cp dist/built/*.tar.gz dist/built/*.pkg dist/built/*.zip dist/built/*.ipa dist/built/*.apk dist/release/
          cp deploy/install/install.sh dist/release/
          cp dist/gateway/dieter-gateway-deploy.tar.gz dist/gateway/gateway-manifest.json \
            dist/gateway/gateway-manifest.sigstore.json dist/gateway/gateway-release.lock.json dist/release/
          (cd dist/release && sha256sum -- * > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/release/SHA256SUMS.sigstore.json dist/release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFIED_BY: ${{ inputs.qualified_by }}
        run: bundle exec fastlane publish dist:dist/release channel:dev ${QUALIFIED_BY:+qualified_by:"$QUALIFIED_BY"}
      - name: Release summary
        env:
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "### Dieter $DIETER_RELEASE_VERSION (build $DIETER_RELEASE_BUILD) from \`$GITHUB_SHA\`"
            echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG · image \`$IMAGE\` · attestations: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/attestations"
            echo "| Asset | Bytes | SHA-256 |"
            echo "|---|---:|---|"
            while read -r sum name; do echo "| $name | $(stat -c %s "dist/release/$name") | \`$sum\` |"; done < dist/release/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

  testflight:
    needs: [version, publish]
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-signing
    permissions:
      contents: read
    env:
      DIETER_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DIETER_RELEASE_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: '[[ "$GITHUB_REPOSITORY" == "$(jq -r .repository config/identity.json)" ]]'
      - uses: ./.github/actions/setup
        with:
          tools: ruby gem:bundler
          bundle: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ios
          path: dist/ios
      - name: Upload and deliver to internal testers
        env:
          IOS_APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_BASE64 }}
          IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane ios beta ipa:dist/ios/Dieter-iOS.ipa

  promote:
    if: inputs.channel == 'stable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: '[[ "$GITHUB_REPOSITORY" == "$(jq -r .repository config/identity.json)" ]]'
      - uses: ./.github/actions/setup
        with:
          tools: ruby gem:bundler cosign
          bundle: "true"
      - name: Verify and promote the tested bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: bundle exec fastlane promote tag:"$TAG"
