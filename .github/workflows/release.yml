name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Choose release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
      android_code: ${{ steps.version.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Derive version from the latest release line
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: just release version

  go-binaries:
    name: ${{ matrix.asset }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: dieter-linux-amd64
            component: daemon
            goos: linux
            goarch: amd64
          - asset: dieter-linux-arm64
            component: daemon
            goos: linux
            goarch: arm64
          - asset: dieter-gateway-linux-amd64
            component: gateway
            goos: linux
            goarch: amd64
          - asset: dieter-gateway-linux-arm64
            component: gateway
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET: ${{ matrix.asset }}
          COMPONENT: ${{ matrix.component }}
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: just "${COMPONENT}" package-release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-daemon:
    name: macOS daemon and native capture helper
    needs: version
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Select Xcode 26.5
        run: just release select-xcode
      - name: Build daemon package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: just daemon package-macos
      - name: Check signing configuration
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: just release signing-config
      - name: Sign and notarize daemon package
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: just --yes daemon sign-notarize-macos
      - name: Package daemon
        run: just daemon archive-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dieter-darwin-arm64
          path: dist/dieter-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android release APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Install Android SDK packages
        run: just android install-sdk
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: just android restore-release-keystore
      - name: Build signed release APK
        env:
          DIETER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dieter-android-release.jks
          DIETER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DIETER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DIETER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DIETER_RELEASE_VERSION: ${{ needs.version.outputs.number }}
          DIETER_RELEASE_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: just android build-release
      - name: Package APK
        run: just android package-release
      - name: Verify APK signature
        run: just android verify-release
      - uses: actions/upload-artifact@v4
        with:
          name: dieter-android
          path: dist/Dieter-Android.apk
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS app (Apple Silicon)
    needs: version
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - name: Select Xcode 26.5
        run: just release select-xcode
      - name: Restore compiled Swift release dependencies
        uses: actions/cache@v4
        with:
          path: apps/mac/.build/dieter-local
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.5-dieter-mac-release-v1-${{ hashFiles('apps/mac/Package.swift', 'apps/mac/Package.resolved', 'apps/mac/Vendor/**/Package.swift') }}
      - name: Build release app
        run: just mac build release
      - name: Set app version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: just mac set-release-version
      - name: Check signing configuration
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: just release signing-config
      - name: Sign and notarize app
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: just --yes mac sign-notarize-release
      - name: Package app bundle
        run: just mac package-release
      - uses: actions/upload-artifact@v4
        with:
          name: dieter-macos-arm64
          path: dist/Dieter-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [version, go-binaries, macos-daemon, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: just release checksums
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: just --yes release publish
      - name: Keep only the newest two releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: just --yes release prune

  homebrew:
    name: Publish Homebrew packages
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"
      - uses: actions/download-artifact@v4
        with:
          name: dieter-darwin-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dieter-macos-arm64
          path: dist
      - name: Publish public daemon and app packages and update the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: dbpprt/homebrew-tap
          VERSION: ${{ needs.version.outputs.tag }}
        run: just --yes release homebrew
