# Categories of the generated notes of dev releases (label your pull requests).
# Stable releases use the CHANGELOG.md section of their version instead.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
