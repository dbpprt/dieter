# Grouped version updates for every ecosystem the repository pins: weekly,
# except the harness runtime, which is checked daily.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: gradle
    directory: /apps/kotlin
    schedule: { interval: weekly }
    groups: { gradle: { patterns: ["*"] } }
  # The agent CLIs (Claude Code, Codex, OMP) and the AI SDK harness adapters
  # are checked daily, before the nightly release, and their group merges on
  # its own once ci-ok passes (dependabot-automerge.yml).
  - package-ecosystem: npm
    directory: /internal/harness/runtime
    schedule: { interval: daily, time: "00:30", timezone: Etc/UTC }
    groups:
      agents:
        patterns: ["@anthropic-ai/*", "@openai/codex", "@oh-my-pi/*", "@ai-sdk/*", "ai"]
      npm: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /apps/apple/mac/MarkdownPreview
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: bundler
    directory: /
    schedule: { interval: weekly }
    groups: { bundler: { patterns: ["*"] } }
  - package-ecosystem: swift
    directories:
      ["/apps/apple/DieterKit", "/apps/apple/mac", "/apps/apple/ios/Host", "/native/macos"]
    schedule: { interval: weekly }
    groups: { swift: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /deploy/gateway
    schedule: { interval: weekly }
