baseURL = "https://getdieter.com/"
defaultContentLanguage = "en"
title = "Dieter · headless coding agents across your machines"

enableRobotsTXT = true
enableInlineShortcodes = true
disableKinds = ["taxonomy", "term", "rss"]

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1

[outputs]
  home = ["html", "robots"]
  section = ["html"]
  page = ["html"]

# Pretty, cache-friendly output for GitHub Pages.
[permalinks]
  docs = "/docs/:slug/"

[params]
  description = "Run coding agents on always-on Macs and headless Linux hosts. Boards, conversations, terminals, and screens across your machines, from native Mac, Android, and iOS clients."
  tagline = "Many agents, many machines, one interface."
  subtitle = "Coding agents across all your machines."
  author = "Dieter contributors"
  github = "https://github.com/dbpprt/dieter"
  ogImage = "images/og-image.png"
  brewFormula = "brew install dbpprt/tap/dieter"
  brewCask = "brew install --cask dbpprt/tap/dieter-app"
  pronunciation = "DEE-ter"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# Brand files come from the single source in assets/brand instead of copies.
# Declaring static mounts replaces Hugo's default, so static/ is listed first.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../assets/brand/assets/fonts"
    target = "static/fonts"
  [[module.mounts]]
    source = "../assets/brand/assets"
    target = "static"
    files = ["favicon.ico"]
  [[module.mounts]]
    source = "../assets/brand/assets/svg"
    target = "static/brand"
    files = ["favicon.svg"]
  [[module.mounts]]
    source = "../assets/brand/assets/png"
    target = "static/images"
    files = ["app-icon-dark-512.png"]

[build]
  [build.buildStats]
    enable = false

[minify]
  disableJSON = true
  minifyOutput = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"
