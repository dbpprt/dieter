{{ define "main" }}
<section class="hero" style="min-height:64vh;display:grid;place-items:center;text-align:center">
  <div class="wrap">
    <span class="eyebrow" style="justify-content:center">Error 404</span>
    <h1 style="font-size:clamp(2.6rem,8vw,5rem);margin-top:16px">Page not found.</h1>
    <p class="hero__sub" style="margin-inline:auto">That page doesn&rsquo;t exist, but the docs and downloads do.</p>
    <div class="hero__cta">
      <a class="btn btn--primary btn--lg" href="{{ site.Home.RelPermalink }}">Back home</a>
      <a class="btn btn--ghost btn--lg" href="{{ "docs/" | relURL }}">Documentation</a>
    </div>
  </div>
</section>
{{ end }}
