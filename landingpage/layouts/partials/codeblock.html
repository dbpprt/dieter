{{- /* A copyable shell codeblock. Usage:
     {{ partial "codeblock" (dict "lines" (slice "cmd one" "cmd two")) }} */ -}}
{{- $lines := .lines -}}
{{- $copy := delimit $lines "\n" -}}
<div class="codeblock">
  <button class="copy-mini" data-copy="{{ $copy }}" aria-label="Copy commands">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>
  <pre><code>{{- range $i, $l := $lines -}}
{{- if $i }}{{ "\n" }}{{ end -}}
<span class="sigil">$</span> {{ $l }}
{{- end -}}</code></pre>
</div>
