baseURL = "https://getdieter.com/"
defaultContentLanguage = "en"
title = "Dieter · coding agents across all your machines"

enableRobotsTXT = true
enableInlineShortcodes = true
disableKinds = ["taxonomy", "term", "rss"]

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1

[outputs]
  home = ["html", "robots"]
  section = ["html"]
  page = ["html"]

# Pretty, cache-friendly output for GitHub Pages.
[permalinks]
  docs = "/docs/:slug/"

[params]
  description = "A native workspace for coding agents on your machines. Boards, chats, files, terminals, and remote screens on macOS and Android, with iOS in beta."
  tagline = "Many agents, many machines, one interface."
  subtitle = "Coding agents across all your machines."
  author = "Dieter contributors"
  github = "https://github.com/dbpprt/dieter"
  ogImage = "images/og-image.png"
  brewFormula = "brew install dbpprt/tap/dieter"
  brewCask = "brew install --cask dbpprt/tap/dieter-app"
  pronunciation = "DEE-ter"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[build]
  [build.buildStats]
    enable = false

[minify]
  disableJSON = true
  minifyOutput = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"
