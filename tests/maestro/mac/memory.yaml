# Maestro syntax, run in-app: Maestro has no macOS driver.
# Agent memory: turn memory on in the project's settings, start a dream and
# apply and undo what it staged, save Settings › Agent memory, and turn the
# project's memory off again. The fixture saved one memory and a memory
# setting on the mock harness whose dreams verify that memory and wait for
# review. The creation and conversation switches are covered by the render
# tests and the mobile flow.
appId: com.getdieter.mac
name: Mac agent memory
tags: [smoke]
---
- launchApp
- tapOn:
    id: 'sidebar\.project\..+\.settings'
- scrollUntilVisible:
    element:
      id: project.memory
    timeout: 30000
- tapOn:
    id: project.memory
- takeScreenshot: mac-memory-project-on
- tapOn:
    id: project.context.save
- extendedWaitUntil:
    notVisible:
      id: project.memory
    timeout: 30000
# The project's settings now show its memory and can start a dream.
# The switch is always there; the status and the dream below it follow once
# the saved switch has reached the app.
- tapOn:
    id: 'sidebar\.project\..+\.settings'
- scrollUntilVisible:
    element:
      id: project.memory
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: project.memory.status
      text: ".*1 saved memory.*"
    timeout: 30000
- tapOn:
    id: project.memory.dream
- extendedWaitUntil:
    visible:
      id: project.memory.open-dream
    timeout: 30000
- takeScreenshot: mac-memory-dream-started
- tapOn:
    id: project.memory.open-dream
- extendedWaitUntil:
    visible:
      id: conversation.memory-dream.title
      text: "Dream awaiting review"
    timeout: 300000
- takeScreenshot: mac-memory-dream-staged
- tapOn:
    id: conversation.memory-dream.apply
- extendedWaitUntil:
    visible:
      id: conversation.memory-dream.title
      text: "Dream applied"
    timeout: 30000
- tapOn:
    id: conversation.memory-dream.undo
- extendedWaitUntil:
    visible:
      id: conversation.memory-dream.title
      text: "Dream undone"
    timeout: 30000
- takeScreenshot: mac-memory-dream-undone
# The account's memory setting: the fixture saved the mock harness.
- tapOn:
    id: sidebar.settings
- tapOn:
    id: settings.agent-memory
- extendedWaitUntil:
    visible:
      id: memory-settings
    timeout: 30000
- takeScreenshot: mac-memory-settings
# Save saves a change only: switch automatic dreams on, save, then restore.
- tapOn:
    id: memory-dreaming
- scrollUntilVisible:
    element:
      id: memory-save
    centerElement: true
- tapOn:
    id: memory-save
- extendedWaitUntil:
    visible:
      id: memory-saved
    timeout: 30000
- scrollUntilVisible:
    element:
      id: memory-dreaming
    direction: UP
    centerElement: true
- tapOn:
    id: memory-dreaming
- scrollUntilVisible:
    element:
      id: memory-save
    centerElement: true
- assertNotVisible:
    id: memory-saved
- tapOn:
    id: memory-save
- extendedWaitUntil:
    visible:
      id: memory-saved
    timeout: 30000
- assertNotVisible:
    id: memory-error
# Memory off again for the flows after this one.
- tapOn:
    id: 'sidebar\.project\..+\.settings'
- scrollUntilVisible:
    element:
      id: project.memory
    timeout: 30000
- tapOn:
    id: project.memory
- tapOn:
    id: project.context.save
- extendedWaitUntil:
    notVisible:
      id: project.memory
    timeout: 30000
