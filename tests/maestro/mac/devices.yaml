# Maestro syntax, run in-app: Maestro has no macOS driver.
# The launch pairs this Mac with the fixture's code; Settings › Devices then
# lists this Mac and the fixture machine from the pinned device roster.
appId: com.getdieter.mac
name: Mac trusted devices
tags: [smoke]
---
- launchApp
- tapOn:
    id: sidebar.settings
- assertVisible:
    id: destination.Settings
- tapOn:
    id: settings.devices
- extendedWaitUntil:
    visible:
      id: devices.this-device
    timeout: 30000
- assertVisible:
    id: 'devices\.device'
    text: "Isolated E2E machine"
- assertVisible:
    id: devices.code
- assertNotVisible:
    id: pairing.view
- takeScreenshot: mac-devices
