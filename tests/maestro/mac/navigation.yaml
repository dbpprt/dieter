# Maestro syntax, run in-app: Maestro has no macOS driver.
appId: com.dbpprt.dieter
name: Mac navigation
tags: [smoke]
---
- launchApp
- tapOn:
    id: sidebar.inbox
- assertVisible:
    id: destination.Inbox
- tapOn:
    id: sidebar.all-chats
- assertVisible:
    id: destination.All chats
- tapOn:
    id: sidebar.screens
- assertVisible:
    id: destination.Screens
- tapOn:
    id: sidebar.settings
- assertVisible:
    id: destination.Settings
- tapOn:
    id: sidebar.inbox
- assertVisible:
    id: destination.Inbox
- assertNotVisible:
    id: destination.Settings
- takeScreenshot: mac-navigation
