# Maestro syntax, run in-app: Maestro has no macOS driver.
# Settings › Providers shows the fixture's seeded accounts with their usage; a
# new Claude account signs in on the fixture machine with the fixture's pasted
# code and is removed again; ChatGPT's Personal offers its reset credit.
appId: com.getdieter.mac
name: Mac provider accounts
tags: [smoke]
---
- launchApp
- tapOn:
    id: sidebar.settings
- assertVisible:
    id: destination.Settings
- tapOn:
    id: settings.providers
- extendedWaitUntil:
    visible:
      id: 'providers\.account\.[^.]+'
      text: "Work"
    timeout: 60000
- assertVisible:
    id: 'providers\.account\.[^.]+\.window\.five_hour'
    text: ".*62% left"
- takeScreenshot: mac-providers
- tapOn:
    id: providers.add
    text: "Claude"
- tapOn:
    id: providers.add.label
- inputText: "Scratch"
- tapOn:
    id: providers.add.submit
- extendedWaitUntil:
    visible:
      id: providers.signin.code
    timeout: 60000
- tapOn:
    id: providers.signin.code
- inputText: "FIXTURE-CODE"
- tapOn:
    id: providers.signin.submit
- extendedWaitUntil:
    visible:
      id: providers.signin.status
      text: "Signed in"
    timeout: 60000
- tapOn:
    id: providers.signin.done
- extendedWaitUntil:
    visible:
      id: 'providers\.account\.[^.]+\.machine\..+'
      text: "Scratch · Signed in"
    timeout: 60000
- takeScreenshot: mac-providers-signed-in
- tapOn:
    id: 'providers\.account\.[^.]+\.remove'
    text: "Scratch"
- tapOn: "Remove account"
- extendedWaitUntil:
    notVisible:
      id: 'providers\.account\.[^.]+'
      text: "Scratch"
    timeout: 60000
# ChatGPT's accounts follow Claude's on the page.
- scroll
- assertVisible:
    id: 'providers\.account\.[^.]+'
    text: "Personal"
- assertVisible:
    id: 'providers\.account\.[^.]+\.reset'
    text: "Personal"
- takeScreenshot: mac-providers-chatgpt
