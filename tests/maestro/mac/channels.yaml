# Maestro syntax, run in-app: Maestro has no macOS driver.
# Agent channels: the seeded project's channel is listed without any setting,
# it opens, and a post from the Mac shows in its live stream.
appId: com.getdieter.mac
name: Mac agent channels
tags: [full]
---
- launchApp
- tapOn:
    id: sidebar.channels
- assertVisible:
    id: destination.Channels
- extendedWaitUntil:
    visible:
      id: 'channels\.row\..+'
      text: "Isolated E2E"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: channels.stream
      text: "#Isolated E2E"
    timeout: 60000
- tapOn:
    id: channels.composer
- inputText: "Hello agents"
- tapOn:
    id: channels.composer.send
- extendedWaitUntil:
    visible:
      id: 'channels\.message\..+'
      text: "Hello agents"
    timeout: 30000
- takeScreenshot: mac-channels
