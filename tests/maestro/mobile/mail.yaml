# Agent mail: the seeded audit report opens from the Mail tab; its wide table
# scrolls sideways on its own while the message stays put. Swiping a message
# left archives it with an undo, the Archive mailbox lists archived mail, and
# the New task form offers the mail toggle.
appId: ${APP_ID}
name: Mail
tags: [smoke]
---
- runFlow: common/launch.yaml
- tapOn:
    text: "Mail"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Dependency audit — 3 critical, 7 outdated"
    timeout: 40000
- tapOn:
    text: "Dependency audit — 3 critical, 7 outdated"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: mail-open-conversation
    timeout: 30000
- assertVisible: "Open conversation"
# Bring the heading below the table on screen, so the whole table is above the
# floating navigation bar: a swipe from the table's centre must not start on the
# bar, where it switches tabs.
- scrollUntilVisible:
    element:
      text: "Suggested next steps"
    direction: DOWN
    timeout: 30000
# The last column sits past the right edge on phones.
- repeat:
    while:
      notVisible: "Notes"
    times: 4
    commands:
      - swipe:
          from:
            id: markdown-table
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible: "Notes"
# Only the table moved: the heading right below it is still in place. (The
# subject and the paragraph above the table may have scrolled away on small
# screens to reach it.)
- assertVisible: "Suggested next steps"
- takeScreenshot: mail-message
- runFlow: common/back.yaml
- extendedWaitUntil:
    visible: "Invoice migration finished: 12,408 rows moved"
    timeout: 30000
- swipe:
    from:
      text: "Invoice migration finished: 12,408 rows moved"
    direction: LEFT
# Undo is timed: tap it immediately instead of spending its lifetime on a
# separate visibility query and screenshot on a slow simulator. tapOn requires
# the action to be visible; the following assertion verifies the restoration.
# A tap taken from a hierarchy read while the snackbar still slides in can miss
# it; then nothing changes and the tap is repeated.
- tapOn:
    text: "Undo"
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Invoice migration finished: 12,408 rows moved"
    timeout: 40000
- takeScreenshot: mail-restored
- tapOn:
    id: chrome-title-menu
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Archive"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Nightly backup completed \\(41\\.2 GB\\)"
    timeout: 10000
- takeScreenshot: mail-archive
- tapOn:
    text: "Projects"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Main"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: chrome-new-task
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: mail-access
    direction: DOWN
    # Hosted simulators take seconds per swipe and hierarchy read; the form is long.
    timeout: 60000
- takeScreenshot: mail-access
- tapOn:
    id: chrome-cancel-creation
    waitToSettleTimeoutMs: 500
