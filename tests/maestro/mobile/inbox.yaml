# Inbox: the Review filter finds a card without scrolling, pinning it moves it
# to the Pinned section, and swiping it left archives it and offers an undo.
appId: ${APP_ID}
name: Inbox
tags: [smoke]
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
    visible:
      id: chrome-inbox-filter
    timeout: 40000
# Show only cards waiting for review: the card is then on screen without a
# scroll, which can fling past it on a small emulator.
- tapOn:
    id: chrome-inbox-filter
    waitToSettleTimeoutMs: 500
- tapOn:
    id: menu-inbox-status-review
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Ship the new project picker"
    timeout: 10000
- longPressOn: "Ship the new project picker"
- tapOn:
    text: "Pin in Inbox"
    waitToSettleTimeoutMs: 500
# An idle pinned card leaves Recent for the Pinned section and keeps its pin
# mark.
- extendedWaitUntil:
    visible:
      id: inbox-section-pinned
    timeout: 10000
- assertVisible:
    id: "inbox-pinned-.+"
- assertVisible: "Ship the new project picker"
- takeScreenshot: inbox-pinned
# An injected swipe occasionally does not register as a drag; then Undo never
# shows and the swipe runs again. Tapping Undo is left to the Mail flow: right
# after a swipe, Maestro's iOS driver re-reads the snackbar and only taps once
# its 10 s have run out.
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            text: "Ship the new project picker"
          direction: LEFT
      - extendedWaitUntil:
          visible: "Undo"
          timeout: 5000
- extendedWaitUntil:
    notVisible: "Ship the new project picker"
    timeout: 15000
- takeScreenshot: inbox-archived
