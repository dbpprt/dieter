# Inbox: pinning a card gives it the Pinned section, and swiping a card left
# archives it with an undo.
appId: ${APP_ID}
name: Inbox
tags: [smoke]
---
- runFlow: common/launch.yaml
- extendedWaitUntil:
    visible:
      id: inbox-filter-running
    timeout: 40000
- scrollUntilVisible:
    element:
      text: "Ship the new project picker"
    direction: DOWN
    timeout: 30000
- longPressOn: "Ship the new project picker"
- tapOn:
    text: "Pin in Inbox"
    waitToSettleTimeoutMs: 500
# The card moves up to the Pinned section, above where the list was scrolled.
- scrollUntilVisible:
    element:
      id: inbox-section-pinned
    direction: UP
    timeout: 10000
- assertVisible: "Ship the new project picker"
- takeScreenshot: inbox-pinned
# Undo lasts 10 s, which a slow simulator spends on a single visibility check,
# so tap it straight after the swipe without waiting for the list to settle.
# An injected swipe occasionally does not register as a drag; then Undo never
# shows and the pair runs again.
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            text: "Ship the new project picker"
          direction: LEFT
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Undo"
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Ship the new project picker"
    timeout: 40000
