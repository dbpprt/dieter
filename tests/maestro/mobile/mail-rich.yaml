appId: ${APP_ID}
name: Mail offline graphics
tags: [smoke]
---
- runFlow: common/launch.yaml
- tapOn:
    text: "Mail"
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      text: "Release smoke results: all platforms passed"
    direction: DOWN
    timeout: 40000
- tapOn:
    text: "Release smoke results: all platforms passed"
    waitToSettleTimeoutMs: 500
- runFlow:
    file: common/mail-diagram.yaml
    env:
      DIAGRAM: mermaid
- takeScreenshot: mail-rich-mermaid
- runFlow:
    file: common/mail-diagram.yaml
    env:
      DIAGRAM: vega-lite
- takeScreenshot: mail-rich-vega-lite
- scrollUntilVisible:
    element:
      text: "Alias chart"
    direction: DOWN
    timeout: 30000
- runFlow:
    file: common/mail-diagram.yaml
    env:
      DIAGRAM: vegalite
- takeScreenshot: mail-rich-alias
- runFlow:
    file: common/mail-diagram.yaml
    env:
      DIAGRAM: vega
- takeScreenshot: mail-rich-vega-and-alias
- scrollUntilVisible:
    element:
      id: mail-diagram-error
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-rich-error-source
- scrollUntilVisible:
    element:
      text: "End of offline report."
    direction: DOWN
    timeout: 30000
- assertVisible: "Remote image alt text"
- takeScreenshot: mail-rich-offline-boundary
- runFlow: common/back.yaml
- tapOn:
    text: "Invoice migration finished: 12,408 rows moved"
    waitToSettleTimeoutMs: 500
- assertNotVisible:
    id: mail-diagram-mermaid-rendered
- assertVisible: "Open conversation"
- runFlow: common/back.yaml
- tapOn:
    text: "Release smoke results: all platforms passed"
    waitToSettleTimeoutMs: 500
# Reopening restores the reader's position. Start at the header before
# looking down the report for diagrams that may now be above the viewport.
- scrollUntilVisible:
    element:
      id: mail-subject
    direction: UP
    timeout: 30000
- runFlow:
    file: common/mail-diagram.yaml
    env:
      DIAGRAM: mermaid
- takeScreenshot: mail-rich-reopened
- runFlow: common/back.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- runFlow:
    file: common/more.yaml
    env:
      PLACE: settings
- tapOn:
    id: appearance-2
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Mail"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Release smoke results: all platforms passed"
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: mail-subject
    direction: UP
    timeout: 30000
- runFlow:
    file: common/mail-diagram.yaml
    env:
      DIAGRAM: mermaid
- takeScreenshot: mail-rich-dark
