# More → Devices: the fixture's machine approved this app's pairing code, so
# the account's trusted devices list this device and that machine.
appId: ${APP_ID}
name: Devices
tags: [smoke]
---
- runFlow: common/launch.yaml
- runFlow:
    file: common/more.yaml
    env:
      PLACE: devices
- extendedWaitUntil:
    visible:
      id: device-this
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Isolated E2E machine"
- takeScreenshot: devices
