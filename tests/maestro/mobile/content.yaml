# Transcript links → daemon-backed Markdown → relative link and image preview.
appId: ${APP_ID}
name: Conversation links and images
tags: [smoke]
---
- runFlow: common/launch.yaml
- tapOn:
    text: "Projects"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Main"
    timeout: 40000
- tapOn:
    text: "Main"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Design the mobile workspace"
    waitToSettleTimeoutMs: 500
# The link sits above the fold on short screens, under the top bar or behind
# the floating composer: centre it before tapping.
- scrollUntilVisible:
    element:
      text: ".*Open workspace guide.*"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    text: ".*Open workspace guide.*"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ".*One durable conversation.*"
    timeout: 30000
- tapOn:
    text: ".*Read linked guide.*"
    waitToSettleTimeoutMs: 500
- assertVisible: ".*Workspace links open on the owning machine.*"
- tapOn:
    id: "chrome-back|BackButton"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: ".*Workspace preview.*"
    waitToSettleTimeoutMs: 500
# Quick Look can hide its toolbar while showing an image. Verify the actual
# rendered image canvas instead of depending on a visible Done button.
- runFlow:
    when:
      platform: iOS
    commands:
      # Quick Look loads the image out of process: seconds on a hosted simulator.
      - extendedWaitUntil:
          visible:
            id: QLPreviewControllerView
          timeout: 60000
      - extendedWaitUntil:
          visible:
            text: Image canvas
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: Close preview
      - assertVisible: workspace-preview.png
- takeScreenshot: workspace-image-preview
