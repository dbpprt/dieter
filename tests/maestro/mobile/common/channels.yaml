# The body of the Channels flow, run only where the Channels tab exists.
appId: ${APP_ID}
---
- runFlow:
    file: tab.yaml
    env:
      TAB: "Channels"
- extendedWaitUntil:
    visible: "Agent channels are off"
    timeout: 30000
- tapOn:
    id: channels-enable
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "#Isolated E2E"
    timeout: 60000
- tapOn:
    text: "#Isolated E2E"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: channel-audience-hint
    timeout: 60000
- tapOn:
    id: channel-input
    waitToSettleTimeoutMs: 500
- inputText: "Hello agents"
- tapOn:
    id: channel-send
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "channel-message-.+"
    timeout: 30000
- assertVisible: "Hello agents"
- takeScreenshot: channels-stream
- runFlow: back.yaml
- tapOn:
    text: "Chats"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Ideas for the next iteration"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "From agent channels"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: peer-notice-m_e2e_notice
    direction: UP
- takeScreenshot: channels-peer-notice
- tapOn:
    id: peer-notice-open-m_e2e_notice
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: channel-audience-hint
    timeout: 30000
- runFlow: back.yaml
- runFlow:
    file: tab.yaml
    env:
      TAB: "Tools"
- scrollUntilVisible:
    element:
      id: tool-settings
- tapOn:
    id: tool-settings
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: settings-channels
- tapOn:
    id: settings-channels
    waitToSettleTimeoutMs: 500
