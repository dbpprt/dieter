# Opens the tab named ${TAB}. An iPhone shows four tabs and More; the others
# (Channels, Tools) open from the More list.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: "More"
    commands:
      - tapOn:
          text: "More"
          waitToSettleTimeoutMs: 500
- tapOn:
    text: ${TAB}
    waitToSettleTimeoutMs: 500
