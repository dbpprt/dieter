# An overview shell must connect while the app also observes conversation terminals.
# The session's title says when it is connected; Android's native terminal view
# does not expose its test tag.
appId: ${APP_ID}
name: Terminals
tags: [full]
---
- runFlow: common/launch.yaml
- runFlow:
    file: common/more.yaml
    env:
      PLACE: terminals
- tapOn:
    id: chrome-new-terminal
    waitToSettleTimeoutMs: 500
- tapOn:
    id: terminal-name
- inputText: "Maestro terminal"
- tapOn:
    id: "chrome-create-terminal|sheet-create-terminal"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Maestro terminal"
    timeout: 20000
- tapOn:
    text: "Maestro terminal"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "Isolated E2E machine · Connected"
    timeout: 20000
- assertNotVisible: ".*Reconnecting.*"
- takeScreenshot: terminal-connected
- runFlow: common/back.yaml
- tapOn:
    text: "Maestro terminal"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "Isolated E2E machine · Connected"
    timeout: 20000
- assertNotVisible: ".*Reconnecting.*"
- takeScreenshot: terminal-reopened
