# Queued input stays pinned while browsing history, then runs after slow cleanup.
appId: ${APP_ID}
name: Send queued message now
tags: [full]
---
- runFlow: common/launch.yaml
- tapOn:
    text: "Projects"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Main"
    timeout: 40000
- tapOn:
    text: "Main"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: chrome-new-task
    waitToSettleTimeoutMs: 500
- tapOn:
    id: task-title
    waitToSettleTimeoutMs: 500
- inputText: "Send now test"
- tapOn:
    id: task-prompt
    waitToSettleTimeoutMs: 500
- inputText: |-
    mock-queue-hold mock-queue-slow-stop

    Earlier context one.

    Earlier context two.

    Earlier context three.

    Earlier context four.

    Earlier context five.

    Earlier context six.

    Earlier context seven.

    Earlier context eight.
- tapOn:
    id: chrome-start-working
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: stop-agent
    timeout: 60000
- tapOn:
    id: message-input
    waitToSettleTimeoutMs: 500
- inputText: "mock-activity-reply"
- tapOn:
    id: send-message
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Queued · runs after the current turn"
    timeout: 20000
- takeScreenshot: message-queued
- assertVisible: "mock-activity-reply"
# The queued text sits inside a bubble in the queue: a descendant, not a direct
# child, on Android.
- assertVisible:
    id: composer-queue
    containsDescendants:
      - text: "mock-activity-reply"
- assertNotVisible:
    id: conversation-timeline
    containsDescendants:
      - text: "mock-activity-reply"
# Drag the history itself. The timeline spans the whole screen and its centre
# lies on the queue pinned above the composer (on the 320x640 CI emulator too),
# so a drag from the element's centre moves nothing; the upper quarter is
# history on every phone layout.
- hideKeyboard
- swipe:
    start: 50%, 25%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "Jump to latest"
    timeout: 5000
- assertVisible:
    id: composer-queue
    containsDescendants:
      - id: queue-send-now-.*
- assertVisible:
    id: message-input
- takeScreenshot: message-queued-scrolled
- tapOn:
    id: queue-send-now-.*
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Waiting for agent to stop…"
    timeout: 10000
- assertVisible: "The current turn must stop before this message starts."
- assertVisible:
    id: queue-send-now-.*
    enabled: false
- takeScreenshot: send-now-stopping
- tapOn:
    text: "Jump to latest"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Activity reply ready to read."
    timeout: 30000
- assertNotVisible: "Queued · runs after the current turn"
- assertNotVisible: "Waiting for agent to stop…"
- assertNotVisible:
    id: queue-send-now-.*
- assertNotVisible:
    id: composer-queue
- takeScreenshot: send-now-delivered
