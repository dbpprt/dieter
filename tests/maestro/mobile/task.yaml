# New task → live mock turn → follow-up in the same conversation → Review.
appId: ${APP_ID}
name: Task turn
tags: [smoke]
---
- runFlow: common/launch.yaml
- tapOn:
    text: "Projects"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Main"
    timeout: 40000
- tapOn:
    text: "Main"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: chrome-new-task
    waitToSettleTimeoutMs: 500
- tapOn:
    id: task-title
    waitToSettleTimeoutMs: 500
- inputText: "Maestro task"
- tapOn:
    id: task-prompt
    waitToSettleTimeoutMs: 500
- inputText: "First turn"
- tapOn:
    id: chrome-start-working
    waitToSettleTimeoutMs: 500
# Each mock turn starts a Node worker that loads the full harness module graph;
# on a loaded hosted macOS runner that has taken up to 172 s (2026-10-12).
- extendedWaitUntil:
    visible: "Mock harness received: First turn.*"
    timeout: 300000
- tapOn:
    id: message-input
    waitToSettleTimeoutMs: 500
- inputText: "Second turn"
- tapOn:
    id: send-message
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Mock harness received: Second turn.*"
    timeout: 300000
# Review becomes available once the turn has settled, which trails its reply.
# It is the last chip of a horizontally scrolling row and can sit past the
# right edge on phones (for example once the context chip appears), so scroll
# the row until it shows; on wider screens the swipes do nothing.
- repeat:
    while:
      notVisible:
        id: move-review
    times: 15
    commands:
      - swipe:
          from:
            id: composer-chips
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: move-review
    timeout: 60000
- tapOn:
    id: move-review
    waitToSettleTimeoutMs: 500
# Android draws its own back button; iOS uses the system one.
- runFlow: common/back.yaml
# On iPad, going back from the task returns to the project list; reopen the board.
- runFlow:
    when:
      notVisible:
        id: lane-2
    commands:
      - tapOn:
          text: "Main"
          waitToSettleTimeoutMs: 500
- tapOn:
    id: lane-2
    waitToSettleTimeoutMs: 500
- assertVisible: "Maestro task"
- takeScreenshot: task-review
