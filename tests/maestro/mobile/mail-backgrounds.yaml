appId: "${APP_ID}"
name: Mail chart backgrounds
tags:
  - full
---
- runFlow: common/launch.yaml
- tapOn:
    waitToSettleTimeoutMs: 500
    text: Tools
- runFlow:
    when:
      notVisible:
        id: appearance-1
    commands:
      - scrollUntilVisible:
          element:
            id: tool-settings
          direction: DOWN
      - tapOn:
          id: tool-settings
          waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: appearance-1
    direction: UP
- tapOn:
    waitToSettleTimeoutMs: 500
    id: appearance-1
- tapOn:
    waitToSettleTimeoutMs: 500
    text: Mail
- extendedWaitUntil:
    visible: Chart background comparison
    timeout: 40000
- takeScreenshot: mail-rows-light
- tapOn:
    waitToSettleTimeoutMs: 500
    text: Chart background comparison
- scrollUntilVisible:
    element:
      text: vega-lite Null
    direction: DOWN
    timeout: 30000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: mail-diagram-vega-lite-rendered
    timeout: 30000
- scrollUntilVisible:
    element:
      text: vega-lite Omitted
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-backgrounds-light-vega-lite-null
- scrollUntilVisible:
    element:
      text: vega-lite Omitted
    direction: DOWN
    timeout: 30000
    centerElement: true
- extendedWaitUntil:
