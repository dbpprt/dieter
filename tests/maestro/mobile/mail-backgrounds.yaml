    timeout: 30000
- scrollUntilVisible:
    element:
      text: vega-lite White
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-backgrounds-light-vega-lite-omitted
- scrollUntilVisible:
    element:
      text: vega-lite White
    direction: DOWN
    timeout: 30000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: mail-diagram-vega-lite-rendered
    timeout: 30000
- scrollUntilVisible:
    element:
      text: vega Null
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-backgrounds-light-vega-lite-white
- scrollUntilVisible:
    element:
      text: vega Null
    direction: DOWN
    timeout: 30000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: mail-diagram-vega-rendered
    timeout: 30000
- scrollUntilVisible:
    element:
      text: vega Omitted
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-backgrounds-light-vega-null
- scrollUntilVisible:
    element:
      text: vega Omitted
    direction: DOWN
    timeout: 30000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: mail-diagram-vega-rendered
    timeout: 30000
- scrollUntilVisible:
    element:
      text: vega White
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-backgrounds-light-vega-omitted
- scrollUntilVisible:
    element:
      text: vega White
    direction: DOWN
    timeout: 30000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: mail-diagram-vega-rendered
    timeout: 30000
- scrollUntilVisible:
    element:
      text: End of background comparison.
    direction: DOWN
    timeout: 30000
- takeScreenshot: mail-backgrounds-light-vega-white
- runFlow: common/back.yaml
- tapOn:
    waitToSettleTimeoutMs: 500
    text: "Invoice migration finished: 12,408 rows moved"
- assertNotVisible:
    id: mail-diagram-vega-rendered
- runFlow: common/back.yaml
- tapOn:
