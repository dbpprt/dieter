version: 1

# This is the release default embedded in the Dieter binary. To customize the
# catalog without rebuilding Dieter, copy this file to
# $DIETER_HOME/harnesses.yaml (normally ~/.dieter/harnesses.yaml), or pass a
# different file with --harness-config / DIETER_HARNESS_CONFIG.
harnesses:
  - id: codex
    name: Codex
    adapter: codex
    capabilities:
      - id: model-selection
        level: between-turns
      - id: effort-selection
        level: between-turns
      - id: task-plan
        level: snapshots
    options:
      - id: fast_mode
        name: Fast mode
        description: Run supported Codex models faster at a higher usage rate.
        type: boolean
        default: "false"
        mutable: true
        models:
          - gpt-6.1-sol
          - gpt-6-astra
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
          - gpt-5.5
          - gpt-5.4
    defaultModel: gpt-5.6-sol
    effort:
      label: Reasoning
      # Union of the model-specific levels advertised by the bundled Codex CLI.
      options:
        - id: low
          name: Low
        - id: medium
          name: Medium
        - id: high
          name: High
        - id: xhigh
          name: Extra high
        - id: max
          name: Max
        - id: ultra
          name: Ultra
    # Fallback for unavailable discovery; live models come from Codex's model cache.
    models:
      - id: gpt-6.1-sol
        name: GPT-6.1 Sol
        defaultEffort: low
        efforts: [low, medium, high, xhigh, max, ultra]
      - id: gpt-6-astra
        name: GPT-6 Astra
        defaultEffort: medium
        efforts: [low, medium, high, xhigh, max, ultra]
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
        defaultEffort: xhigh
        efforts: [low, medium, high, xhigh, max, ultra]
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra
        defaultEffort: medium
        efforts: [low, medium, high, xhigh, max, ultra]
      - id: gpt-5.6-luna
        name: GPT-5.6 Luna
        defaultEffort: medium
        efforts: [low, medium, high, xhigh, max]
      - id: gpt-5.5
        name: GPT-5.5
        defaultEffort: medium
        efforts: [low, medium, high, xhigh]
      - id: gpt-5.4
        name: GPT-5.4
        defaultEffort: medium
        efforts: [low, medium, high, xhigh]
      - id: gpt-5.3-codex
        name: GPT-5.3 Codex
        defaultEffort: medium
        efforts: [low, medium, high, xhigh]
      - id: gpt-5.3-codex-spark
        name: GPT-5.3 Codex Spark
        defaultEffort: high
        efforts: [low, medium, high, xhigh]

  - id: claude-code
    name: Claude Code
    adapter: claude-code
    capabilities:
      - id: model-selection
        level: between-turns
      - id: effort-selection
        level: between-turns
      - id: subagents
        level: lifecycle
      - id: task-plan
        level: snapshots
    defaultModel: sonnet
    effort:
      label: Thinking
      options:
        - id: low
          name: Low
        - id: medium
          name: Medium
        - id: high
          name: High
        - id: xhigh
          name: Extra high
        - id: max
          name: Max
    models:
      # Stable aliases follow the model selected by the installed adapter.
      - id: sonnet
        name: Sonnet
      - id: opus
        name: Opus
      - id: haiku
        name: Haiku
      # Keep existing Dieter conversations resumable after a registry upgrade.
      - id: claude-sonnet-4-5
        name: Claude Sonnet 4.5
      - id: claude-opus-4-1
        name: Claude Opus 4.1

  - id: pi
    name: Pi
    adapter: pi
    capabilities:
      - id: model-selection
        level: between-turns
      - id: effort-selection
        level: between-turns
      - id: task-plan
        level: host-tool
    defaultModel: default
    effort:
      label: Thinking
      options:
        - id: "off"
          name: "Off"
        - id: minimal
          name: Minimal
        - id: low
          name: Low
        - id: medium
          name: Medium
        - id: high
          name: High
        - id: xhigh
          name: Extra high
    models:
      - id: default
        name: Configured default
        runtimeModel: ""

  - id: omp
    name: Oh My Pi
    adapter: omp-acp
    capabilities:
      - id: model-selection
        level: between-turns
      - id: subagents
        level: progress
      - id: task-plan
        level: phases
    options:
      - id: advisor
        name: Advisor
        description: Ask OMP's advisor for an independent review during the turn.
        type: boolean
        default: "false"
    defaultModel: openai-codex/gpt-6-sol
    effort:
      label: Thinking
      options:
        - id: "off"
          name: "Off"
        - id: minimal
          name: Minimal
        - id: low
          name: Low
        - id: medium
          name: Medium
        - id: high
          name: High
        - id: xhigh
          name: Extra high
        - id: max
          name: Max
        - id: auto
          name: Auto
    models:
      # Keep OMP's UI intentionally small. OMP still owns credentials and
      # provider routing for these exact selectors on each daemon host.
      - id: openai-codex/gpt-6-luna
        name: GPT-6 Luna · Codex
        contextWindow: 272000
        defaultEffort: high
        efforts: [low, medium, high, xhigh, max]
      - id: openai-codex/gpt-6-sol
        name: GPT-6 Sol · Codex
        contextWindow: 272000
        defaultEffort: high
        efforts: [low, medium, high, xhigh, max]
      - id: openai-codex/gpt-6-astra
        name: GPT-6 Astra · Codex
        contextWindow: 272000
        defaultEffort: high
        efforts: [low, medium, high, xhigh, max]

  - id: dsh
    name: DeepSeek Harness
    adapter: dsh-acp
    capabilities:
      - id: model-selection
        level: between-turns
      - id: task-plan
        level: snapshots
    defaultModel: default
    models:
      - id: default
        name: Configured default
        runtimeModel: ""

  # Strix (github.com/usestrix/strix) is an autonomous pentesting agent. Each
  # turn runs the pinned Strix executable headless against the conversation's
  # worktree; it needs a reachable Docker engine for its sandbox. Models are
  # LiteLLM ids. The model API key comes from the vault item named by the
  # credentials option: its password is LLM_API_KEY, its first URL is
  # LLM_API_BASE, and KEY=VALUE lines in its notes may set STRIX_LLM and the
  # other STRIX_*/LLM_* settings Strix reads.
  - id: strix
    name: Strix
    adapter: strix
    capabilities:
      - id: model-selection
        level: between-turns
      - id: effort-selection
        level: between-turns
      - id: subagents
        level: progress
      - id: task-plan
        level: snapshots
    options:
      - id: credentials
        name: Credentials
        description: Vault item with the model API key (password), an optional API base URL, and optional STRIX_LLM or other settings as KEY=VALUE lines in its notes.
        type: string
        default: strix
        mutable: true
      # Scan mode, scope and targets are fixed by the first message: a
      # follow-up resumes the same Strix run, which keeps them.
      - id: scan_mode
        name: Scan mode
        description: How deep Strix tests. Quick takes minutes; deep can take hours.
        type: enum
        default: quick
        choices:
          - value: quick
            name: Quick
          - value: standard
            name: Standard
          - value: deep
            name: Deep
      - id: scope
        name: Scope
        description: Test the whole worktree, or only the changes on its branch since it left the base branch.
        type: enum
        default: full
        choices:
          - value: full
            name: Whole worktree
          - value: changes
            name: Changes only
      - id: max_budget_usd
        name: Budget (USD)
        description: Model spend after which Strix stops the scan. Send a message to continue past it.
        type: string
        default: "10"
        mutable: true
      - id: targets
        name: Targets
        description: Extra targets besides the worktree, such as a staging URL or an OpenAPI file, separated by spaces. Only list systems you are authorized to test.
        type: string
    defaultModel: default
    effort:
      label: Reasoning
      options:
        - id: low
          name: Low
        - id: medium
          name: Medium
        - id: high
          name: High
        - id: xhigh
          name: Extra high
        - id: max
          name: Max
    models:
      - id: default
        name: From the vault item
        runtimeModel: ""
        defaultEffort: high
      - id: openrouter/z-ai/glm-5.3
        name: GLM-5.3 · OpenRouter
        defaultEffort: high
      - id: vercel_ai_gateway/zai/glm-5.3
        name: GLM-5.3 · Vercel AI Gateway
        defaultEffort: high
      - id: openrouter/deepseek/deepseek-v4.1-flash-1017
        name: DeepSeek V4.1 Flash · OpenRouter
        defaultEffort: high
      - id: deepseek/deepseek-v4-pro
        name: DeepSeek V4 Pro
        defaultEffort: high
      - id: moonshot/kimi-k3.1-pro
        name: Kimi K3.1 Pro
        defaultEffort: high
