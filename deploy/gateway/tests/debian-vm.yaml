# Disposable Debian fixture; no operator mounts or automatic host port forwards.
minimumLimaVersion: 2.0.0
vmType: vz
cpus: 1
memory: 1GiB
disk: 16GiB
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2
    arch: aarch64
    digest: sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPortRange: [1, 65535]
    guestIP: 0.0.0.0
    proto: any
    guestIPMustBeZero: false
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends docker.io docker-cli python3 ca-certificates openssl curl
      systemctl enable --now docker
